name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the commit in .cancho-rev, the one place to change it.
      - name: Read the compiler pin
        id: pin
        run: echo "rev=$(tr -d '[:space:]' < .cancho-rev)" >> "$GITHUB_OUTPUT"

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cancho-bin
          key: cancho-${{ steps.pin.outputs.rev }}-ubuntu-24.04

      - name: Check out cancho
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Build cancho
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd cancho
          scripts/install.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/cancho-release" && mkdir -p target/release && cp "$RUNNER_TEMP/cancho-release/bin/cancho" target/release/cancho
          mkdir -p ~/cancho-bin
          cp target/release/cancho ~/cancho-bin/
          cp -r packages ~/cancho-bin/packages

      # The authority report is pinned: what the assistant can do is a committed file, and a new capability or
      # foreign call is a red diff that only a commit of the new file turns green (scripts/check-authority.sh).
      - name: The authority report of the front door is the committed one (no network, no foreign code)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh

      - name: The authority report of the native agent is the committed one (net_out, files, no process)
        run: CANCHO=$HOME/cancho-bin/cancho CANCHO_PACKAGES=$HOME/cancho-bin/packages scripts/check-authority.sh --agent

      - name: The authority report of the provider is the committed one (net_out, the one reachable host class)
        run: CANCHO=$HOME/cancho-bin/cancho CANCHO_PACKAGES=$HOME/cancho-bin/packages scripts/check-authority.sh --provider

      - name: The authority report of the plan checker is the committed one (it reads one file and prints)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --plan

      - name: The authority report of the module-tree checker is the committed one (it reads one file and prints)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --tree

      - name: The authority report of the project driver is the committed one (it runs the checker and the agent and writes the work directory; no network)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --project

      - name: The authority report of the dashboard tool is the committed one (it reads a run directory and writes one file; no process, no network)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --board

      - name: The authority report of the build command is the committed one (the plan agent, the checker and the unit agent as processes, the work directory; no network)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --build

      - name: The authority report of the MCP server is the committed one (standard input and output, files under its root, processes; no network)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --mcp

      - name: The authority report of the memory miner is the committed one (it reads the journals it is named and writes the memory directory; no process, no network)
        run: CANCHO=$HOME/cancho-bin/cancho scripts/check-authority.sh --lessons

      - name: The pins can fail (a stray net_out is a red diff)
        run: |
          export CANCHO=$HOME/cancho-bin/cancho CANCHO_PACKAGES=$HOME/cancho-bin/packages
          scripts/check-authority.sh --prove
          scripts/check-authority.sh --provider --prove
          scripts/check-authority.sh --plan --prove
          scripts/check-authority.sh --tree --prove
          scripts/check-authority.sh --project --prove
          scripts/check-authority.sh --board --prove
          scripts/check-authority.sh --build --prove
          scripts/check-authority.sh --mcp --prove
          scripts/check-authority.sh --lessons --prove

      - name: Unit tests (the loop's decisions, the failure signature)
        run: $HOME/cancho-bin/cancho test tests/loop_check_test.cho tests/signature_test.cho src/loop_check.cho src/signature.cho --std

      - name: The gates (checker, snapshot ring, trail, agent contract, Ollama agent, driver loop, provider)
        run: |
          export CANCHO=$HOME/cancho-bin/cancho CANCHO_PACKAGES=$HOME/cancho-bin/packages
          sh scripts/test-checker.sh
          sh scripts/test-snapshot.sh
          sh scripts/test-trail.sh
          sh scripts/test-agent.sh
          sh scripts/test-fix.sh
          sh scripts/test-acceptance.sh
          sh scripts/test-verdicts.sh
          sh scripts/test-plan.sh
          sh scripts/test-tree.sh
          sh scripts/test-tree.sh --mutants
          sh scripts/test-project.sh
          sh scripts/test-parallel.sh
          sh scripts/test-multi-file.sh
          sh scripts/test-board.sh
          sh scripts/test-board.sh --mutants
          sh scripts/test-lessons.sh
          sh scripts/test-lessons.sh --mutants
          sh scripts/test-build.sh
          sh scripts/test-library.sh
          sh scripts/test-profile.sh
          sh scripts/test-journal.sh
          sh scripts/test-eval.sh
          sh scripts/test-page.sh
          sh scripts/test-briefs.sh
          sh scripts/test-skill.sh
          sh scripts/test-reference-ports.sh
          sh scripts/test-driver.sh
          sh scripts/test-provider.sh
          sh scripts/test-native.sh
          sh scripts/test-anthropic-wire.sh
          sh scripts/test-reply.sh
          sh scripts/test-prompt.sh
          sh scripts/test-metrics.sh
          sh scripts/test-cases.sh
          sh scripts/test-review.sh
          sh scripts/test-splice.sh
          sh scripts/test-planner.sh
          sh scripts/test-services.sh
          sh scripts/test-users.sh
          sh scripts/test-service-plans.sh users
          sh scripts/test-agent-native.sh
          sh scripts/test-agent-native-ollama.sh

      # The MCP server (docs/mcp.md), driven over pipes against a stand-in agent, and the gate proven able to fail: eleven broken servers, each red.
      - name: The MCP server gate, and its mutants
        run: |
          export CANCHO=$HOME/cancho-bin/cancho CANCHO_PACKAGES=$HOME/cancho-bin/packages
          sh scripts/test-mcp.sh
          sh scripts/test-mcp.sh --mutants

      # The one-command tool builds as a program with the pinned compiler (docs/build.md).
      - name: The build command builds
        run: |
          CANCHO=$HOME/cancho-bin/cancho sh scripts/build-cancho-build.sh
          test -x build/cancho-build

      # The MCP server builds as a program with the pinned compiler, with the build and board tools it calls.
      - name: The MCP server builds
        run: |
          CANCHO=$HOME/cancho-bin/cancho sh scripts/build-cancho-mcp.sh
          test -x build/cancho-mcp

      # The memory miner builds as a program with the pinned compiler and mines the legacy fixture (docs/memory.md).
      - name: The memory miner builds and mines
        run: |
          export CANCHO=$HOME/cancho-bin/cancho
          sh scripts/cancho-lessons.sh --memory "$RUNNER_TEMP/memory" --legacy tests/lessons/legacy
          test -s "$RUNNER_TEMP/memory/lessons.jsonl"
