<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cancho-code board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5f6b7d; --line: #dde2ea; --soft: #eef1f5;
    --waiting: #7b8798; --building: #2f6fed; --verified: #17884f; --stuck: #c8372d; --regressed: #b46a00; --unknown: #8a6bb8;
    --ok: #17884f; --bad: #c8372d; --warn: #b46a00;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --panel: #1b212b; --ink: #e6eaf1; --muted: #98a3b5; --line: #2c3442; --soft: #232b37;
      --waiting: #8e9bb0; --building: #6a9cff; --verified: #4cc38a; --stuck: #ff7a70; --regressed: #f0b050; --unknown: #b79ae6;
      --ok: #4cc38a; --bad: #ff7a70; --warn: #f0b050;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 0.95rem; margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .title { min-width: 0; }
  .title p { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .filebtn {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; min-height: 36px;
  }
  button:hover, .filebtn:hover { border-color: var(--muted); }
  button:focus-visible, .filebtn:focus-within, .sig:focus-visible, summary:focus-visible, .dep:focus-visible { outline: 2px solid var(--building); outline-offset: 2px; }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  label.auto { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 0.9rem; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; border: 1px solid currentColor; }
  .pill.done { color: var(--ok); } .pill.stuck, .pill.gate_failed, .pill.provider_error, .pill.no_plan { color: var(--bad); }
  .pill.running, .pill.none { color: var(--muted); }

  #notice { margin: 0 0 12px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--panel); }
  #notice.error { border-color: var(--bad); }
  #notice[hidden] { display: none; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .metric .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .metric .v { font-size: 1.35rem; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .metric .s { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .metric.wide { grid-column: span 2; }
  .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; display: flex; margin-top: 6px; }
  .bar i { display: block; height: 100%; }
  .unknown-v { color: var(--muted); font-weight: 400; }

  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
  .col { background: var(--soft); border-radius: 12px; padding: 10px; min-width: 0; border-top: 3px solid var(--c); }
  .col h2 { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 8px; }
  .col h2 .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .col.waiting { --c: var(--waiting); } .col.building { --c: var(--building); } .col.verified { --c: var(--verified); }
  .col.stuck { --c: var(--stuck); } .col.regressed { --c: var(--regressed); } .col.unknown { --c: var(--unknown); }
  .col .empty { color: var(--muted); padding: 4px; font-size: 0.9rem; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; min-width: 0; }
  .card.flash, .sec.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--building); } to { box-shadow: 0 0 0 0 transparent; } }
  .card .head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .card .id { font-weight: 650; overflow-wrap: anywhere; }
  .card .fn { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
  .card .file { font-family: var(--mono); font-size: 0.72rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 0.78rem; padding: 1px 8px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .dep { font: inherit; font-size: 0.78rem; padding: 1px 8px; min-height: 0; border-radius: 999px; display: inline-flex; gap: 5px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--waiting); display: inline-block; }
  .dot.waiting { background: var(--waiting); } .dot.building { background: var(--building); } .dot.verified { background: var(--verified); }
  .dot.stuck { background: var(--stuck); } .dot.regressed { background: var(--regressed); } .dot.unknown, .dot.missing { background: var(--unknown); }
  .nums { margin-top: 6px; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  details.trail { margin-top: 8px; }
  details.trail summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); }
  ol.attempts { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
  ol.attempts li { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; font-size: 0.82rem; min-width: 0; }
  ol.attempts li.verified { border-color: var(--verified); } ol.attempts li.refused, ol.attempts li.defect { border-color: var(--stuck); }
  ol.attempts li.outage { border-color: var(--regressed); }
  .a-line { display: flex; flex-wrap: wrap; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .a-out { font-weight: 600; }
  .sig { margin-top: 2px; font-family: var(--mono); font-size: 0.76rem; color: var(--muted); overflow-wrap: anywhere;
         display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .sig.open { display: block; }

  footer { margin-top: 18px; color: var(--muted); font-size: 0.85rem; }
  footer .files { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0; }
  footer .have::before { content: "\2713"; margin-right: 4px; color: var(--ok); }
  footer .lack::before { content: "\2014"; margin-right: 4px; color: var(--warn); }
  footer details { margin-top: 8px; }
  footer dt { font-weight: 600; margin-top: 6px; color: var(--ink); }
  footer dd { margin: 0; }

  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 85%, transparent);
          border: 3px dashed var(--building); font-size: 1.3rem; z-index: 10; pointer-events: none; }
  #drop.on { display: flex; }


  /* tabs, the detail panel and the story */
  .tabs { display: flex; gap: 6px; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  .tabs[hidden] { display: none; }
  .tabs { overflow-x: auto; }
  .tabs button[hidden] { display: none; }
  .tabs button { border: 0; flex: 0 0 auto; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; background: none; padding: 6px 14px; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--building); }
  .view[hidden] { display: none; }
  .card .open { margin-top: 8px; font-size: 0.82rem; padding: 3px 10px; min-height: 30px; }

  #shade { position: fixed; inset: 0; background: rgba(10, 14, 20, 0.5); z-index: 20; }
  #shade[hidden], #panel[hidden] { display: none; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column;
           border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(0, 0, 0, 0.25); }
  #panel:focus { outline: none; }
  .phead { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .phead h2 { font-size: 1.05rem; overflow-wrap: anywhere; }
  .phead p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
  #pbody { overflow: auto; padding: 12px 16px 28px; flex: 1; -webkit-overflow-scrolling: touch; }
  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; min-width: 0; }
  .sec > h3 { margin: 0 0 6px; font-size: 0.92rem; }
  .sec.refused, .sec.defect, .sec.truncated, .sec.failed { border-left: 4px solid var(--stuck); }
  .sec.accepted, .sec.verified, .sec.written { border-left: 4px solid var(--verified); }
  .kv { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 4px 0 8px; }
  .kv .chip b { font-weight: 600; }
  .note { color: var(--muted); font-size: 0.84rem; margin: 4px 0; }
  .note.warn { color: var(--warn); }
  details.blob { margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  details.blob > summary { cursor: pointer; padding: 5px 10px; font-size: 0.86rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  details.blob > summary .sz { color: var(--muted); font-size: 0.78rem; }
  details.blob > .in { padding: 0 10px 8px; }
  details.blob details.blob { background: var(--panel); }
  pre.txt { margin: 0; padding: 8px 10px; background: var(--soft); border-radius: 6px; font: 0.8rem/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
            max-height: 45vh; overflow: auto; }
  .diff { margin: 0; background: var(--soft); border-radius: 6px; font: 0.8rem/1.4 var(--mono); max-height: 45vh; overflow: auto; padding: 4px 0; }
  .diff .dl { display: block; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .add { background: color-mix(in srgb, var(--verified) 20%, transparent); }
  .diff .del { background: color-mix(in srgb, var(--stuck) 20%, transparent); }
  .diff .hunk { color: var(--building); }
  .diff .meta { color: var(--muted); font-weight: 600; }
  ul.errs { margin: 4px 0; padding-left: 20px; font-size: 0.86rem; overflow-wrap: anywhere; }
  table.dropped { border-collapse: collapse; width: 100%; font-size: 0.84rem; margin: 4px 0; }
  table.dropped th, table.dropped td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  ol.tl { list-style: none; margin: 0; padding: 0; }
  ol.tl li { margin: 0; }
  ol.tl button.row { width: 100%; text-align: left; display: grid; grid-template-columns: 5.5em 8.5em 1fr; gap: 8px; align-items: baseline; border: 0;
                     border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 6px 4px; min-height: 0; }
  ol.tl button.row:hover { background: var(--soft); }
  ol.tl .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  ol.tl .k { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
  ol.tl .s { overflow-wrap: anywhere; font-size: 0.86rem; }
  ol.tl li.bad .s { color: var(--bad); } ol.tl li.good .s { color: var(--ok); }
  .storyhead { margin-bottom: 12px; }
  .storyhead h2 { font-size: 1.05rem; margin-bottom: 4px; }


  /* the graph and the timeline */
  .gsum { margin: 0 0 8px; font-weight: 600; overflow-wrap: anywhere; }
  .gsum.warn { color: var(--warn); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; background: var(--panel); }
  .glegend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 10px; font-size: 0.84rem; align-items: center; }
  .glegend .lg { display: inline-flex; gap: 6px; align-items: center; }
  .crit-sw { display: inline-block; width: 26px; height: 0; border-top: 4px solid var(--ink); }
  .gscroll, .tscroll { overflow: auto; max-width: 100%; max-height: 74vh; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; -webkit-overflow-scrolling: touch; }
  .gscroll:focus-visible, .tscroll:focus-visible, .node:focus-visible { outline: 2px solid var(--building); outline-offset: 2px; }
  svg.graph { display: block; }
  svg.graph .edge { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: 0.75; }
  svg.graph .edge.crit { stroke: var(--ink); stroke-width: 3.2; opacity: 1; }
  svg.graph .edge.hl { stroke: var(--building); stroke-width: 2.4; opacity: 1; }
  svg.graph .arrow { fill: var(--muted); } svg.graph .arrow.crit { fill: var(--ink); }
  svg.graph .node { cursor: pointer; --c: var(--waiting); }
  svg.graph .node.waiting { --c: var(--waiting); } svg.graph .node.building { --c: var(--building); } svg.graph .node.verified { --c: var(--verified); }
  svg.graph .node.stuck { --c: var(--stuck); } svg.graph .node.regressed { --c: var(--regressed); } svg.graph .node.unknown { --c: var(--unknown); }
  svg.graph .node:focus { outline: none; }
  svg.graph .box { fill: var(--panel); stroke: var(--c); stroke-width: 2; }
  svg.graph .node:hover .box { fill: var(--soft); }
  svg.graph .node.crit .box { stroke-width: 3; }
  svg.graph .ring { fill: none; stroke: transparent; stroke-width: 3; }
  svg.graph .node.crit .ring { stroke: var(--ink); }
  svg.graph .node:focus-visible .ring { stroke: var(--building); stroke-width: 3.5; stroke-dasharray: none; }
  svg.graph .dotc { fill: var(--c); }
  svg.graph text { fill: var(--ink); font-family: var(--sans); font-size: 12px; pointer-events: none; }
  svg.graph .t-id { font-weight: 650; font-size: 13px; } svg.graph .t-rank { fill: var(--muted); font-size: 11px; }
  svg.graph .t-fn { font-family: var(--mono); font-size: 11px; fill: var(--muted); } svg.graph .t-facts { font-size: 10.5px; fill: var(--muted); }
  details.glist { margin-top: 10px; } details.glist summary { cursor: pointer; font-size: 0.86rem; color: var(--muted); }
  details.glist ul { margin: 4px 0; padding-left: 20px; font-size: 0.86rem; overflow-wrap: anywhere; }

  .tgrid { --tw: 700px; --lw: 104px; width: calc(var(--lw) + var(--tw) + 44px); padding-bottom: 6px; }
  .trow { display: flex; align-items: stretch; min-height: 30px; border-bottom: 1px solid var(--line); }
  .tlab { flex: 0 0 var(--lw); width: var(--lw); position: sticky; left: 0; z-index: 3; background: var(--panel); border-right: 1px solid var(--line); padding: 4px 8px;
          font: 0.84rem/1.3 var(--sans); text-align: left; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.tlab { border: 0; border-right: 1px solid var(--line); border-radius: 0; min-height: 0; cursor: pointer; }
  button.tlab:hover { background: var(--soft); }
  .ttrack { position: relative; flex: 0 0 var(--tw); width: var(--tw); min-height: 30px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-repeat: repeat-x; }
  .taxis { position: sticky; top: 0; z-index: 4; background: var(--panel); } .taxis .ttrack { background-image: none; height: 38px; }
  .tick { position: absolute; top: 4px; font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 3px; white-space: nowrap; }
  .brk-l { position: absolute; top: 20px; font-size: 0.72rem; color: var(--warn); white-space: nowrap; padding-left: 3px; background: var(--panel); }
  .brk { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--warn); }
  .tmiss { position: absolute; left: 8px; top: 5px; font-size: 0.8rem; color: var(--muted); }
  .tb { position: absolute; border-radius: 4px; }
  .tb.span { top: 3px; bottom: 3px; background: var(--soft); border: 1px solid var(--line); }
  .tb.span.open { border-right-style: dashed; }
  .tb.sweep { bottom: 3px; height: 6px; background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); opacity: 0.8; }
  .tb.att { top: 6px; bottom: 6px; min-width: 4px; padding: 0; min-height: 0; border: 1px solid transparent; border-radius: 4px; cursor: pointer; background: var(--waiting); }
  .tb.att.good { background: var(--verified); } .tb.att.bad { background: var(--stuck); }
  .tb.att.bad, .tb-sw.bad { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255, 255, 255, 0.4) 4px 7px); }
  .tb.att:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; z-index: 2; }
  .tb-sw { display: inline-block; width: 22px; height: 12px; border-radius: 3px; background: var(--waiting); }
  .tb-sw.good { background: var(--verified); } .tb-sw.bad { background-color: var(--stuck); }
  .est { margin: 12px 0 4px; font-weight: 600; overflow-wrap: anywhere; }

  @media (max-width: 640px) {
    .phead, #pbody { padding-left: 12px; padding-right: 12px; }
    ol.tl button.row { grid-template-columns: 4.5em 1fr; }
    ol.tl .k { display: none; }
  }

  @media (max-width: 640px) {
    main { padding: 12px; }
    .metric.wide { grid-column: span 1; }
    .metric .v { font-size: 1.15rem; }
    .board { grid-template-columns: 1fr; }
    /* on a phone the columns stack: what needs a look first, and the empty ones as a single line */
    .col.building { order: 1; } .col.stuck { order: 2; } .col.regressed { order: 3; } .col.unknown { order: 4; }
    .col.waiting { order: 5; } .col.verified { order: 6; }
    .col.none { padding-bottom: 2px; }
    .col.none h2 { padding-bottom: 4px; }
    .col.none .empty { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="title">
      <h1 id="title">cancho-code board</h1>
      <p id="subtitle" class="muted">read-only view of a run</p>
    </div>
    <div class="tools">
      <span id="verdict"></span>
      <label class="filebtn">Open board.json<input id="pick" type="file" accept=".json,application/json"></label>
      <button id="reload" type="button" title="Read board.json again">Reload</button>
      <label class="auto"><input id="auto" type="checkbox"> refresh every 5 s</label>
    </div>
  </header>

  <p id="notice" hidden></p>
  <div id="tabs" class="tabs" role="tablist" aria-label="Views">
    <button id="tab-board" type="button" role="tab" aria-selected="true" aria-controls="view-board">Board</button>
    <button id="tab-graph" type="button" role="tab" aria-selected="false" aria-controls="view-graph" tabindex="-1">Graph</button>
    <button id="tab-timeline" type="button" role="tab" aria-selected="false" aria-controls="view-timeline" tabindex="-1" hidden>Timeline</button>
    <button id="tab-story" type="button" role="tab" aria-selected="false" aria-controls="view-story" tabindex="-1" hidden>Story</button>
  </div>
  <div id="view-board" class="view" role="tabpanel" aria-labelledby="tab-board">
    <section id="metrics" class="metrics" aria-label="Metrics"></section>
    <section id="board" class="board" aria-label="Units"></section>
  </div>
  <div id="view-graph" class="view" role="tabpanel" aria-labelledby="tab-graph" hidden></div>
  <div id="view-timeline" class="view" role="tabpanel" aria-labelledby="tab-timeline" hidden></div>
  <div id="view-story" class="view" role="tabpanel" aria-labelledby="tab-story" hidden></div>
  <footer id="foot"></footer>
</main>
<div id="shade" hidden></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" tabindex="-1" hidden>
  <div class="phead">
    <div><h2 id="ptitle"></h2><p id="psub"></p></div>
    <button id="pclose" type="button" aria-label="Close (Escape)">Close</button>
  </div>
  <div id="pbody"></div>
</aside>
<div id="drop">Drop board.json here</div>

<script>
"use strict";
var COLS = [
  ["waiting", "Waiting", "Dependencies not verified yet."],
  ["building", "Building", "The unit being built now."],
  ["verified", "Verified", "Its examples pass, and still did at the last sweep."],
  ["stuck", "Stuck", "Failed: the attempts ran out or the same refusal came twice."],
  ["regressed", "Regressed", "Verified once, broken by a later unit, back on the board."],
  ["unknown", "Unknown", "The files that would say are missing."]
];
var state = { data: null, from: "", timer: null, raw: null, view: "board" };

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function fmtInt(v) { return isNum(v) ? Math.round(v).toLocaleString("en-US") : null; }
function fmtPct(v) { return isNum(v) ? (v * 100).toFixed(1) + "%" : null; }
function fmtUsd(v) {
  if (!isNum(v)) return null;
  if (v === 0) return "$0";
  return "$" + (v < 0.01 ? v.toFixed(6) : v.toFixed(4));
}
function fmtSecs(v) {
  if (!isNum(v)) return null;
  if (v < 90) return (Math.round(v * 10) / 10) + " s";
  var m = Math.floor(v / 60), s = Math.round(v - m * 60);
  return m + " min " + s + " s";
}
function fmtMs(v) { return isNum(v) ? (Math.round(v / 100) / 10) + " s" : null; }

// ---- the graph and the timeline: pure logic ---------------------------------------------------------------------------------
// Everything between the markers is a function of plain data (board.json's units and journal events): no page, no clock, no
// network. scripts/test-board.sh cuts this block out and runs it under node (tests/board/page-logic.test.js) against the fixtures
// and against the oracle tests/reference/board_ref.py --layout; keep it free of the page.
// graph-logic:begin
function isNum(v) { return typeof v === "number" && isFinite(v); }
function dict() { return Object.create(null); }
function fmtS(ms) { return (Math.round(ms / 100) / 10) + " s"; }
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

// The agent time of a unit in ms: the sum of its attempts' times in its trail. null when it is not recorded (a trail row with no
// time, or no trail for a unit that was built); a unit nobody has built has none to record, so 0.
function unitMs(u) {
  if (!u) return null;
  if (Array.isArray(u.trail) && u.trail.length) {
    var s = 0;
    for (var i = 0; i < u.trail.length; i++) {
      var m = u.trail[i] && u.trail[i].agent_ms;
      if (!isNum(m)) return null;
      s += m;
    }
    return s;
  }
  return (u.column === "waiting" || u.attempts === 0) ? 0 : null;
}

// Layers of a plan: a unit's layer is the length of the longest chain of dependencies below it (a root is in layer 0). Kahn's
// algorithm, so a cycle, a self-dependency or an unknown dependency never loops: what cannot be placed is `unplaced` and goes in
// one last layer. `ok` is true only for a real DAG. Indices (into `ids`, the plan order without repeated ids) throughout.
function dagLayout(units) {
  var us = [], ids = [], ix = dict(), dups = [];
  (Array.isArray(units) ? units : []).forEach(function (u) {
    if (!u || typeof u.id !== "string") return;
    if (ix[u.id] !== undefined) { dups.push(u.id); return; }
    ix[u.id] = ids.length; ids.push(u.id); us.push(u);
  });
  var n = ids.length, deps = [], succ = [], unknown = [], i;
  for (i = 0; i < n; i++) { deps.push([]); succ.push([]); }
  us.forEach(function (u, k) {
    var seen = dict();
    (Array.isArray(u.deps) ? u.deps : []).forEach(function (d) {
      if (typeof d !== "string" || seen[d]) return;
      seen[d] = true;
      if (ix[d] === undefined) { unknown.push({ unit: ids[k], dep: d }); return; } // MUTANT:unknown
      deps[k].push(ix[d]); succ[ix[d]].push(k);
    });
  });
  var left = [], layer = [], q = [], topo = [], head = 0;
  for (i = 0; i < n; i++) { left.push(deps[i].length); layer.push(0); if (!left[i]) q.push(i); }
  while (head < q.length) {
    var v = q[head++];
    topo.push(v);
    succ[v].forEach(function (s) {
      if (layer[v] + 1 > layer[s]) layer[s] = layer[v] + 1; // MUTANT:layer
      left[s]--;
      if (left[s] === 0) q.push(s);
    });
  }
  var isPlaced = [], unplaced = [], stuck = [], layers = [];
  topo.forEach(function (x) { isPlaced[x] = true; });
  for (i = 0; i < n; i++) {
    if (isPlaced[i]) { while (layers.length <= layer[i]) layers.push([]); layers[layer[i]].push(i); }
    else { layer[i] = null; unplaced.push(ids[i]); stuck.push(i); }
  }
  // fewer crossings: reorder each layer by the mean position of its neighbours, forward and back (ties: plan order)
  var pos = [];
  function renumber() { layers.forEach(function (l) { l.forEach(function (x, p) { pos[x] = p; }); }); }
  renumber();
  for (var pass = 0; pass < 4; pass++) {
    var fwd = pass % 2 === 0;
    for (var step = 0; step < layers.length; step++) {
      var l = fwd ? step : layers.length - 1 - step, ls = layers[l], key = {};
      ls.forEach(function (x) {
        var nb = fwd ? deps[x] : succ[x], t = 0, c = 0;
        nb.forEach(function (y) { if (isPlaced[y]) { t += pos[y]; c++; } });
        key[x] = c ? t / c : pos[x];
      });
      ls.sort(function (a, b) { return key[a] - key[b] || a - b; });
      ls.forEach(function (x, p) { pos[x] = p; });
    }
  }
  if (stuck.length) layers.push(stuck);
  var ok = !unknown.length && !dups.length && !unplaced.length;
  return { ids: ids, units: us, deps: deps, succ: succ, layer: layer, layers: layers, topo: topo, duplicates: dups, unknown: unknown, unplaced: unplaced, ok: ok }; // MUTANT:cycle
}

// The longest chain. `ms` (one number per unit, in `lay.ids` order) weighs a unit by its agent time; without it every unit weighs 1.
// Ties: the end is the first unit (plan order) with the longest chain, and each step back goes to the first dependency, as listed,
// with the longest chain. null for a plan that is not a DAG.
function criticalPath(lay, ms) {
  if (!lay.ok) return null;
  var n = lay.ids.length, tot = [], pred = [], best = -1, end = -1;
  lay.topo.forEach(function (v) {
    var p = -1;
    lay.deps[v].forEach(function (d) { if (p < 0 || tot[d] > tot[p]) p = d; });
    pred[v] = p;
    tot[v] = (ms ? ms[v] : 1) + (p < 0 ? 0 : tot[p]);
  });
  for (var i = 0; i < n; i++) { var b = tot[i]; if (b > best) { best = b; end = i; } } // MUTANT:critical
  var path = [];
  for (var c = end; c >= 0; c = pred[c]) path.push(lay.ids[c]);
  path.reverse();
  return { basis: ms ? "agent time" : "units", total: n ? best : 0, path: path };
}

// The graph of a board: layers, and the critical path by agent time when every unit has one recorded (else by number of units).
function graphModel(units) {
  var lay = dagLayout(units), ms = lay.units.map(unitMs), all = ms.length > 0, sum = 0;
  ms.forEach(function (m) { if (m === null) all = false; else sum += m; });
  var timed = all && sum > 0 ? ms : null;
  var noPlan = lay.units.length > 0 && lay.units.every(function (u) { return u.deps === null || u.deps === undefined; });
  return { lay: lay, ms: timed, crit: criticalPath(lay, timed), noPlan: noPlan };
}

function listIds(a, max) { return a.length > max ? a.slice(0, max).join(", ") + " and " + (a.length - max) + " more" : a.join(", "); }

function graphProblems(lay) {
  var p = [];
  lay.unknown.slice(0, 3).forEach(function (u) { p.push("unit " + u.unit + " needs " + u.dep + ", which is not in the plan"); });
  if (lay.unknown.length > 3) p.push((lay.unknown.length - 3) + " more dependencies are not in the plan");
  if (lay.duplicates.length) p.push("the id " + listIds(lay.duplicates, 3) + " is used more than once");
  if (lay.unplaced.length) p.push(listIds(lay.unplaced, 6) + (lay.unplaced.length === 1 ? " is in a cycle or depends on one" : " are in a cycle or depend on one"));
  return p;
}

function graphSummary(m) {
  var lay = m.lay;
  if (!lay.ids.length) return "No units in this run.";
  if (m.noPlan) return "Not recorded: this run has no plan.json, so there are no dependencies to draw.";
  if (!lay.ok) return "The dependencies of this plan are not a DAG: " + graphProblems(lay).join("; ") + ".";
  var widest = 0;
  lay.layers.forEach(function (l) { if (l.length > widest) widest = l.length; });
  var c = m.crit;
  return plural(lay.ids.length, "unit", "units") + " in " + plural(lay.layers.length, "layer", "layers") + " (widest: " + widest + "). Critical path: " +
    plural(c.path.length, "unit", "units") + (c.basis === "agent time"
      ? ", " + fmtS(c.total) + " (longest chain by agent time from the trails)."
      : " (longest chain by number of units: no per-unit agent times are recorded).");
}

// Where each node goes: a column per layer, left to right, the layers centred on each other. Pixels.
function placeGraph(lay) {
  var W = 190, H = 58, GX = 64, GY = 14, PAD = 16, nodes = {}, tall = 0;
  lay.layers.forEach(function (l) { if (l.length > tall) tall = l.length; });
  var colH = tall ? tall * (H + GY) - GY : 0;
  lay.layers.forEach(function (l, c) {
    var off = Math.round((colH - (l.length * (H + GY) - GY)) / 2);
    l.forEach(function (x, r) { nodes[lay.ids[x]] = { x: PAD + c * (W + GX), y: PAD + off + r * (H + GY), layer: c }; });
  });
  var cols = Math.max(1, lay.layers.length);
  return { nodes: nodes, nodeW: W, nodeH: H, width: 2 * PAD + cols * W + (cols - 1) * GX, height: 2 * PAD + colH };
}

// The order the units were handed to the agent, from the journal.
function runOrder(events) {
  var out = [], seen = dict();
  (Array.isArray(events) ? events : []).forEach(function (e) {
    if (e && (e.kind === "unit_start" || e.kind === "attempt") && typeof e.unit === "string" && !seen[e.unit]) { seen[e.unit] = true; out.push(e.unit); }
  });
  return out;
}

var PLAN_GOOD = { written: 1, reviewed: 1, accepted: 1 };
var ATTEMPT_GOOD = { verified: 1, accepted: 1 };
var AXIS_STEPS = [100, 200, 500, 1000, 2000, 5000, 10000, 15000, 30000, 60000, 120000, 300000, 600000, 1800000, 3600000];
var KIND_RANK = { span: 0, attempt: 1, call: 1, sweep: 2 };

// The journal as rows of bars. `t_ms` is when an event was written, after the call it describes, so an attempt that took `ms`
// ran from t_ms - ms to t_ms. x is milliseconds since the first event; a pause of more than two minutes between runs (a run
// resumed later: its run_start comes after the last event of the one before) is taken out of the axis and listed in `breaks`.
function timelineModel(events, units) {
  var evs = Array.isArray(events) ? events : [], xs = [], base = null, prev = null, shift = 0, breaks = [];
  evs.forEach(function (e, i) {
    xs[i] = null;
    if (!e || typeof e !== "object" || !isNum(e.t_ms)) return;
    if (base === null) base = e.t_ms;
    if (e.kind === "run_start" && prev !== null && e.t_ms - prev > 120000) {
      breaks.push({ x: Math.max(0, prev - base - shift), gap_ms: e.t_ms - prev });
      shift += e.t_ms - prev;
    }
    xs[i] = Math.max(0, e.t_ms - base - shift);
    if (prev === null || e.t_ms > prev) prev = e.t_ms;
  });
  var rows = [], byKey = dict(), order = [], total = 0, lastRunStart = 0, endOf = dict();
  var plan = { key: "plan", label: "plan", kind: "plan", missing: true, bars: [], spans: [] };
  rows.push(plan); byKey.plan = plan;
  function rowOf(key, label, kind) {
    if (!byKey[key]) { byKey[key] = { key: key, label: label, kind: kind, missing: false, bars: [], spans: [] }; rows.push(byKey[key]); }
    return byKey[key];
  }
  evs.forEach(function (e, i) {
    var x = xs[i];
    if (x === null) return;
    if (x > total) total = x;
    var unit = typeof e.unit === "string" ? e.unit : null, r;
    if (e.kind === "run_start") lastRunStart = x;
    else if (e.kind === "plan_call") {
      plan.missing = false;
      var pm = isNum(e.ms) ? e.ms : 0, px0 = x - pm;
      plan.bars.push({ kind: "call", good: e.outcome ? !!PLAN_GOOD[e.outcome] : null, x0: Math.max(0, px0), x1: x, ev: i, round: isNum(e.round) ? e.round : null, outcome: e.outcome || null, ms: isNum(e.ms) ? e.ms : null });
    } else if (e.kind === "unit_start" && unit !== null) {
      r = rowOf(unit, unit, "unit");
      if (order.indexOf(unit) < 0) order.push(unit);
      r.spans.push({ x0: x, x1: null });
    } else if (e.kind === "attempt" && unit !== null) {
      r = rowOf(unit, unit, "unit");
      if (order.indexOf(unit) < 0) order.push(unit);
      var ms = isNum(e.ms) ? e.ms : 0;
      var x0 = x - ms; // MUTANT:bar
      r.bars.push({ kind: "attempt", good: e.outcome ? !!ATTEMPT_GOOD[e.outcome] : null, x0: Math.max(0, x0), x1: x, ev: i, unit: unit,
                    n: isNum(e.n) ? e.n : null, outcome: e.outcome || null, ms: isNum(e.ms) ? e.ms : null }); // MUTANT:attemptno
    } else if (e.kind === "unit_end" && unit !== null) {
      r = rowOf(unit, unit, "unit");
      var open = r.spans.filter(function (s) { return s.x1 === null; });
      if (open.length) open[open.length - 1].x1 = x;
      else r.spans.push({ x0: x, x1: x });
      endOf[unit] = x;
    } else if (e.kind === "sweep") {
      var after = typeof e.after_unit === "string" && e.after_unit ? e.after_unit : null;
      var from = after !== null && endOf[after] !== undefined && endOf[after] <= x ? endOf[after] : (after === null ? lastRunStart : x);
      r = after !== null ? rowOf(after, after, "unit") : rowOf("resume", "resume", "resume");
      if (after !== null && order.indexOf(after) < 0) order.push(after);
      r.bars.push({ kind: "sweep", good: null, x0: from, x1: x, ev: i, unit: after });
    }
  });
  rows.forEach(function (r) {
    r.spans.forEach(function (s) {
      var open = s.x1 === null;
      r.bars.push({ kind: "span", good: null, x0: s.x0, x1: open ? total : s.x1, open: open });
    });
    r.bars.sort(function (a, b) { return a.x0 - b.x0 || KIND_RANK[a.kind] - KIND_RANK[b.kind] || a.x1 - b.x1; });
    r.bars.forEach(function (b) { if (b.x1 > total) total = b.x1; });
  });
  var step = AXIS_STEPS[AXIS_STEPS.length - 1], ticks = [], t;
  for (var k = 0; k < AXIS_STEPS.length; k++) if (total / AXIS_STEPS[k] <= 12) { step = AXIS_STEPS[k]; break; }
  for (t = 0; t <= total; t += step) ticks.push(t);
  var ran = dict();
  rows.forEach(function (r) { if (r.kind === "unit") ran[r.key] = true; });
  var notRun = [];
  (Array.isArray(units) ? units : []).forEach(function (u) { if (u && typeof u.id === "string" && !ran[u.id] && notRun.indexOf(u.id) < 0) notRun.push(u.id); });
  var first = null, last = null;
  rows.forEach(function (r) { r.spans.forEach(function (s) { if (first === null || s.x0 < first) first = s.x0; if (s.x1 !== null && (last === null || s.x1 > last)) last = s.x1; }); });
  return { rows: rows, total: total, step: step, ticks: ticks, breaks: breaks, notRun: notRun, order: order, unitsWall: first !== null && last !== null ? last - first : null };
}

// What running independent units together could save, at most: the agent time of all attempts (X) less the longest chain of the
// plan weighed by each unit's agent time (Y). A bound from the journal's own per-attempt times and the plan's dependencies, not a
// promise: the checks, the sweeps and any wait are not in it. Says "not recorded" when what it needs is missing.
function estimateOf(events, units) {
  var per = dict(), X = 0, lacking = false, seen = 0;
  (Array.isArray(events) ? events : []).forEach(function (e) {
    if (!e || e.kind !== "attempt" || typeof e.unit !== "string") return;
    seen++;
    if (isNum(e.ms)) { per[e.unit] = (per[e.unit] || 0) + e.ms; X += e.ms; } else lacking = true;
  });
  var out = { agent_ms: null, critical_ms: null, saved_ms: null, path: null, text: "" };
  if (!seen) { out.text = "Estimate: not recorded (the journal has no attempts)."; return out; }
  if (lacking) { out.text = "Estimate: not recorded (an attempt in the journal has no time)."; return out; }
  out.agent_ms = X;
  var m = graphModel(units);
  if (!m.lay.ids.length || m.noPlan) { out.text = "Estimate: not recorded (this run has no plan.json, so no dependencies)."; return out; }
  if (!m.lay.ok) { out.text = "Estimate: agent time total " + fmtS(X) + "; no critical path (the dependencies of this plan are not a DAG)."; return out; }
  var c = criticalPath(m.lay, m.lay.ids.map(function (id) { return per[id] || 0; }));
  out.critical_ms = c.total; out.path = c.path; out.saved_ms = X - c.total; // MUTANT:saved
  var shown = c.path.length > 6 ? c.path.slice(0, 4).join(", ") + " ... " + c.path[c.path.length - 1] + ", " + c.path.length + " units" : c.path.join(", ");
  out.text = "Estimate: agent time total " + fmtS(X) + "; critical path " + fmtS(c.total) + " (" + shown + "); units run one after another today, so parallel units could save at most " + fmtS(out.saved_ms) + " here.";
  return out;
}
// graph-logic:end

// ---- loading -------------------------------------------------------------------------------------------------------------

function notice(text, isError) {
  var n = $("notice");
  if (!text) { n.hidden = true; return; }
  n.hidden = false;
  n.className = isError ? "error" : "";
  n.textContent = text;
}

function accept(text, from) {
  var d;
  try { d = JSON.parse(text); } catch (e) { notice("That file is not JSON: " + e.message, true); return; }
  if (!d || d.schema !== 1 || !Array.isArray(d.units) || !d.metrics) {
    notice("That is not a board.json made by the board tool (no schema 1, units and metrics).", true);
    return;
  }
  if (text === state.raw && from === state.from) { notice(""); return; }
  state.raw = text;
  state.data = d;
  state.from = from;
  notice("");
  render(d);
}

// The data file: board.json next to this page, or `?data=<a .json path next to it>` (a relative path of plain characters, never a URL).
var source = "board.json";
try {
  var asked = new URLSearchParams(location.search).get("data");
  if (asked && /^[A-Za-z0-9_\/.-]+\.json$/.test(asked) && asked.indexOf("..") < 0 && asked.charAt(0) !== "/") source = asked;
} catch (e) { /* keep the default */ }

function load() {
  fetch(source, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (t) { accept(t, source); })
    .catch(function () {
      if (!state.data) notice("No board.json next to this page could be read (opened from a file, or none there yet). Use “Open board.json” or drop the file on this page.", false);
      else notice("board.json could not be read again; showing what was loaded.", false);
    });
}

function readFile(f) {
  if (!f) return;
  f.text().then(function (t) { accept(t, f.name); });
}

$("pick").addEventListener("change", function (e) { readFile(e.target.files[0]); });
$("reload").addEventListener("click", load);
$("auto").addEventListener("change", function (e) {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (e.target.checked) state.timer = setInterval(load, 5000);
});
var depth = 0;
window.addEventListener("dragenter", function (e) { e.preventDefault(); depth++; $("drop").className = "on"; });
window.addEventListener("dragleave", function () { depth = Math.max(0, depth - 1); if (!depth) $("drop").className = ""; });
window.addEventListener("dragover", function (e) { e.preventDefault(); });
window.addEventListener("drop", function (e) {
  e.preventDefault(); depth = 0; $("drop").className = "";
  if (e.dataTransfer && e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
});

// ---- rendering -----------------------------------------------------------------------------------------------------------

function metric(parent, key, value, sub, tip, wide) {
  var m = el("div", "metric" + (wide ? " wide" : ""));
  if (tip) m.title = tip;
  m.appendChild(el("div", "k", key));
  var v = el("div", "v" + (value === null ? " unknown-v" : ""), value === null ? "unknown" : value);
  m.appendChild(v);
  if (sub) m.appendChild(el("div", "s", sub));
  parent.appendChild(m);
  return m;
}

function renderMetrics(d) {
  var box = $("metrics");
  box.textContent = "";
  var m = d.metrics, r = d.run || {};
  var total = isNum(m.units_total) ? m.units_total : 0;
  var ver = isNum(m.units_verified) ? m.units_verified : 0;
  var u = metric(box, "Units verified", ver + " / " + total, null, "Units in the Verified column over all units of the run.", true);
  var bar = el("div", "bar");
  COLS.forEach(function (c) {
    var n = m.columns ? m.columns[c[0]] : 0;
    if (n && total) {
      var seg = el("i");
      seg.style.width = (100 * n / total) + "%";
      seg.style.background = "var(--" + c[0] + ")";
      seg.title = c[1] + ": " + n;
      bar.appendChild(seg);
    }
  });
  u.appendChild(bar);

  metric(box, "Cost", fmtUsd(m.cost_usd),
    m.cost_per_verified_unit !== null && m.cost_per_verified_unit !== undefined ? fmtUsd(m.cost_per_verified_unit) + " per verified unit" : (d.files && d.files.usage && !d.files.prices ? "no price for this model" : null),
    "Sum over the calls of tokens times the price per million tokens (the prices file given to the tool).");
  var t = m.tokens;
  metric(box, "Tokens out", t ? fmtInt(t.out) : null,
    t ? "in " + fmtInt(t.in) + " · cache read " + fmtInt(t.cache_read) + " · cache write " + fmtInt(t.cache_write) : null,
    "Output tokens, as the API reported them (they include the thinking tokens).");
  metric(box, "Token efficiency", fmtPct(m.efficiency),
    m.efficiency_calls !== null && m.efficiency_calls !== undefined ? "kept calls " + fmtPct(m.efficiency_calls) : null,
    "Of all output tokens, the share that was kept (the last written reply of a verified unit) and new (not the file repeated). eval/metrics.py efficiency.");
  metric(box, "Thinking share", fmtPct(m.thinking_share),
    t && t.thinking !== null && t.thinking !== undefined ? fmtInt(t.thinking) + " thinking tokens" : "not recorded by this run",
    "Thinking tokens over output tokens.");
  metric(box, "Cache read share", fmtPct(m.cache_read_share), null,
    "Cache-read tokens over all input tokens (input + cache write + cache read).");
  metric(box, "Time", fmtSecs(r.seconds), m.calls !== null && m.calls !== undefined ? fmtInt(m.calls) + " model calls" : null, "Seconds of the whole run (run.json or build.json).");
  metric(box, "Audit", m.audit ? m.audit.passed + " / " + m.audit.of : null,
    m.audit && m.audit.of ? fmtPct(m.audit.passed / m.audit.of) : null, "The hidden audit's TOTAL, when audit.txt exists.");
}

function stateOf(d) {
  var by = {};
  d.units.forEach(function (u) { by[u.id] = u.column; });
  return by;
}

function trailItem(a) {
  var li = el("li", a.outcome || "");
  var line = el("div", "a-line");
  line.appendChild(el("span", "", "#" + (a.attempt === null || a.attempt === undefined ? "?" : a.attempt)));
  line.appendChild(el("span", "a-out", a.outcome || "?"));
  line.appendChild(el("span", "muted", a.decision ? "→ " + a.decision : ""));
  var t = fmtMs(a.agent_ms);
  if (t) line.appendChild(el("span", "muted", t));
  li.appendChild(line);
  if (a.sig) {
    var s = el("div", "sig", a.sig);
    s.tabIndex = 0;
    s.title = "Click to show all";
    s.addEventListener("click", function () { s.classList.toggle("open"); });
    li.appendChild(s);
  }
  return li;
}

function card(u, states, usageKnown) {
  var c = el("article", "card");
  c.id = "u-" + u.id;
  var head = el("div", "head");
  head.appendChild(el("span", "id", u.id));
  if (u.function) head.appendChild(el("span", "fn", u.function));
  if (typeof u.file === "string" && u.file) head.appendChild(el("span", "chip file", u.file));
  c.appendChild(head);

  var chips = el("div", "chips");
  chips.appendChild(el("span", "chip", u.attempts === null ? "attempts: unknown" : u.attempts + (u.attempts === 1 ? " attempt" : " attempts")));
  if (u.regressions) chips.appendChild(el("span", "chip warn", "regressed " + u.regressions + "×"));
  c.appendChild(chips);

  if (Array.isArray(u.deps) && u.deps.length) {
    var deps = el("div", "chips");
    deps.appendChild(el("span", "muted", "needs"));
    u.deps.forEach(function (id) {
      var b = el("button", "dep");
      b.type = "button";
      var st = states[id] || "missing";
      b.appendChild(el("span", "dot " + st));
      b.appendChild(el("span", "", id));
      b.title = id + ": " + (states[id] || "not in this run");
      b.addEventListener("click", function () {
        var t = document.getElementById("u-" + id);
        if (!t) return;
        t.scrollIntoView({ block: "center", behavior: "smooth" });
        t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
      });
      deps.appendChild(b);
    });
    c.appendChild(deps);
  }

  var nums = [];
  if (u.calls === 0) {
    nums.push("no model calls yet");
  } else {
    if (u.tokens) {
      nums.push("out " + fmtInt(u.tokens.out) + (u.tokens.thinking !== null && u.tokens.thinking !== undefined ? " (" + fmtInt(u.tokens.thinking) + " thinking)" : ""));
      nums.push("in " + fmtInt(u.tokens.in));
      if (u.tokens.cache_read) nums.push("cache read " + fmtInt(u.tokens.cache_read));
    }
    var cost = fmtUsd(u.cost_usd);
    if (cost) nums.push(cost);
    if (u.calls !== null && u.calls !== undefined) nums.push(u.calls + (u.calls === 1 ? " call" : " calls"));
  }
  c.appendChild(el("div", "nums", nums.length ? nums.join(" · ") : (usageKnown ? "" : "tokens and cost: unknown")));
  var more = el("button", "open", "Details");
  more.type = "button";
  more.title = "The whole story of " + u.id;
  more.setAttribute("aria-label", "Details of unit " + u.id);
  more.addEventListener("click", function () { openUnit(u, null, more); });
  c.appendChild(more);

  if (Array.isArray(u.trail) && u.trail.length) {
    var d = el("details", "trail");
    d.open = u.column === "stuck" || u.column === "regressed" || u.column === "building" || u.trail.length > 1;
    d.appendChild(el("summary", "", "Attempts (" + u.trail.length + ")"));
    var ol = el("ol", "attempts");
    u.trail.forEach(function (a) { ol.appendChild(trailItem(a)); });
    d.appendChild(ol);
    c.appendChild(d);
  } else if (u.trail === null) {
    c.appendChild(el("div", "nums", "trail: unknown (no trail file)"));
  }
  return c;
}

function renderBoard(d) {
  var board = $("board");
  board.textContent = "";
  var states = stateOf(d);
  var usageKnown = !!(d.files && d.files.usage);
  COLS.forEach(function (cdef) {
    var units = d.units.filter(function (u) { return u.column === cdef[0]; });
    if (cdef[0] === "unknown" && !units.length) return;
    var col = el("section", "col " + cdef[0] + (units.length ? "" : " none"));
    var h = el("h2");
    h.title = cdef[2];
    h.appendChild(el("span", "", cdef[1]));
    h.appendChild(el("span", "n", String(units.length)));
    col.appendChild(h);
    if (!units.length) col.appendChild(el("div", "empty", "none"));
    units.forEach(function (u) { col.appendChild(card(u, states, usageKnown)); });
    board.appendChild(col);
  });
}

function renderHead(d) {
  var r = d.run || {};
  $("title").textContent = r.name ? "Run: " + r.name : "cancho-code run";
  var bits = [];

  $("subtitle").textContent = bits.length ? bits.join(" · ") : "read-only view of a run";

function renderFoot(d) {

  [["Cost", "tokens times the price per million tokens, summed over every model call, retries included."],

function render(d) {

// ---- the journal: the detail panel and the story ---------------------------------------------------------------------------
// board.json's `journal` (docs/dashboard.md): the events verbatim, in order, and the blobs they name as bounded excerpts. Anything
// missing is shown as "not recorded", never as empty or zero. Everything here is built with textContent, never markup.

var J = null;                 // the index of the journal of the board on show, or null
var panelState = { open: false, build: null, opener: null };
var BLOBS = [["prompt", "Prompt sent"], ["reply", "Model reply"], ["code", "Code"], ["feedback", "Compiler refusal (full text)"],
             ["checker", "Checker output"], ["acceptance", "Acceptance and test output"], ["diff", "Diff against the previous attempt"],
             ["stderr", "stderr"], ["blob", "Detail"], ["plan", "Plan"]];

function indexJournal(d) {
  var j = d && d.journal;
  if (!j || !Array.isArray(j.events)) return null;
  var ix = { j: j, units: {}, calls: [], review: null, final: null, start: null, end: null, any: false };
  function unit(id) {
    if (!ix.units[id]) ix.units[id] = { start: null, attempts: [], end: null, sweeps: [] };
    return ix.units[id];
  }
  j.events.forEach(function (ev, i) {
    if (!ev || typeof ev !== "object") return;
    var r = { ev: ev, i: i };
    switch (ev.kind) {
      case "run_start": if (!ix.start) ix.start = r; break;
      case "run_end": ix.end = r; break;
      case "plan_call": ix.calls.push(r); break;
      case "plan_review": ix.review = r; break;
      case "plan_final": ix.final = r; break;
      case "unit_start": if (typeof ev.unit === "string") unit(ev.unit).start = r; break;
      case "attempt": if (typeof ev.unit === "string") unit(ev.unit).attempts.push(r); break;
      case "unit_end": if (typeof ev.unit === "string") unit(ev.unit).end = r; break;
      case "sweep": if (typeof ev.after_unit === "string") unit(ev.after_unit).sweeps.push(r); break;
    }
  });
  return ix;
}

function costOf(i) {
  var c = J && J.j.costs ? J.j.costs[i] : null;
  return isNum(c) ? c : null;
}

function blobInfo(name) {
  if (typeof name !== "string") return { s: "absent" };
  var v = (J.j.blobs || {})[name];
  if (v === undefined) return { s: "unlisted" };
  if (v === null) return { s: "missing" };
  if (v.omitted) return { s: "omitted" };
  if (typeof v.text !== "string") return { s: "unlisted" };
  return { s: "ok", v: v };
}

function fmtBytes(n) { return isNum(n) ? (n >= 10240 ? Math.round(n / 1024) + " KiB" : n + " B") : "?"; }

// Unified diff text as coloured lines (the +/- stays in the text, so colour is not the only signal).
function diffView(text) {
  var box = el("div", "diff");
  box.tabIndex = 0;
  var lines = text.split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  lines.forEach(function (ln) {
    var cls = "dl";
    if (/^(\+\+\+|---) /.test(ln) || /^(diff |index )/.test(ln)) cls += " meta";
    else if (ln.charAt(0) === "+") cls += " add";
    else if (ln.charAt(0) === "-") cls += " del";
    else if (ln.slice(0, 2) === "@@") cls += " hunk";
    box.appendChild(el("span", cls, ln === "" ? " " : ln));
  });
  return box;
}

// A collapsible text: the blob `name`, or a note saying why there is none. `o.open`, `o.diff`. null when the event has no such field.
function blobBlock(label, name, o) {
  o = o || {};
  var info = blobInfo(name);
  if (info.s === "absent") return null;
  var det = el("details", "blob");
  det.open = !!o.open;
  var sum = el("summary");
  sum.appendChild(el("span", "", label));
  if (info.s === "ok") sum.appendChild(el("span", "sz", fmtBytes(info.v.bytes)));
  det.appendChild(sum);
  var inn = el("div", "in");
  if (info.s === "ok") {
    if (info.v.text === "") inn.appendChild(el("div", "note", "(empty)"));
    else if (o.diff) inn.appendChild(diffView(info.v.text));
    else { var pre = el("pre", "txt", info.v.text); pre.tabIndex = 0; inn.appendChild(pre); }
    if (info.v.truncated) inn.appendChild(el("div", "note warn", "Truncated: the first " + fmtBytes(J.j.limits && J.j.limits.blob_bytes) + " of " + fmtBytes(info.v.bytes) + ". Full text: journal/blobs/" + name + " in the run directory."));
  } else if (info.s === "missing") {
    inn.appendChild(el("div", "note warn", "Not recorded: the file journal/blobs/" + name + " is missing from the run directory."));
  } else if (info.s === "omitted") {
    inn.appendChild(el("div", "note warn", "Left out of board.json to keep it small. Full text: journal/blobs/" + name + " in the run directory."));
  } else {
    inn.appendChild(el("div", "note warn", "Not recorded: board.json has no text for " + name + "."));
  }
  det.appendChild(inn);
  return det;
}

function primerBlock() {
  var b = blobBlock("primer (same for every call)", "primer.txt", {});
  if (b) return b;
  return el("div", "note", "primer (same for every call): not recorded");
}

function chip(label, value) {
  var c = el("span", "chip");
  if (value === undefined) { c.textContent = label; return c; }
  c.appendChild(el("span", "muted", label + " "));
  c.appendChild(el("b", "", value));
  return c;
}

// tokens, time, stop reason and cost of one call
function callStats(ev, i) {
  var kv = el("div", "kv");
  var missing = [];
  if (typeof ev.outcome === "string") kv.appendChild(chip("outcome", ev.outcome)); else missing.push("outcome");
  if (typeof ev.decision === "string") kv.appendChild(chip("decision", ev.decision));
  if (isNum(ev.ms)) kv.appendChild(chip("time", fmtMs(ev.ms))); else missing.push("time");
  if (typeof ev.stop === "string") kv.appendChild(chip("stop", ev.stop)); else missing.push("stop reason");
  var t = ev.tokens;
  if (t && typeof t === "object") {
    var bits = ["in " + (fmtInt(t.in) || "?"), "out " + (fmtInt(t.out) || "?")];
    if (isNum(t.thinking)) bits.push("thinking " + fmtInt(t.thinking));
    if (isNum(t.cache_read)) bits.push("cache read " + fmtInt(t.cache_read));
    if (isNum(t.cache_write)) bits.push("cache write " + fmtInt(t.cache_write));
    kv.appendChild(chip("tokens", bits.join(" · ")));
    var c = costOf(i);
    if (c !== null) kv.appendChild(chip("cost", fmtUsd(c))); else missing.push("cost (no price for this model)");
  } else {
    missing.push("tokens", "cost");
  }
  if (isNum(ev.exit)) kv.appendChild(chip("exit", String(ev.exit)));
  return { el: kv, missing: missing };
}

function missingNote(list) {
  return list.length ? el("div", "note", "Not recorded: " + list.join(", ") + ".") : null;
}

// ---- the panel ---------------------------------------------------------------------------------------------------------------

function openPanel(title, sub, build, opener) {
  var p = $("panel"), body = $("pbody");
  var keep = panelState.open ? body.scrollTop : 0;
  $("ptitle").textContent = title;
  $("psub").textContent = sub || "";
  body.textContent = "";
  build(body);
  body.scrollTop = keep;
  panelState.build = function () { openPanel(title, sub, build); };
  if (!panelState.open) {
    panelState.open = true;
    panelState.opener = opener || document.activeElement;
    $("shade").hidden = false;
    p.hidden = false;
    document.querySelector("main").inert = true;
    $("pclose").focus();
  }
}

function closePanel() {
  if (!panelState.open) return;
  panelState.open = false;
  $("panel").hidden = true;
  $("shade").hidden = true;
  document.querySelector("main").inert = false;
  var o = panelState.opener;
  panelState.opener = null;
  panelState.build = null;
  if (o && o.focus && document.body.contains(o)) o.focus();
}

$("pclose").addEventListener("click", closePanel);
$("shade").addEventListener("click", closePanel);
document.addEventListener("keydown", function (e) {
  if (!panelState.open) return;
  if (e.key === "Escape") { e.preventDefault(); closePanel(); return; }
  if (e.key !== "Tab") return;
  var f = Array.prototype.filter.call($("panel").querySelectorAll("button, summary, [tabindex='0'], a[href]"), function (n) { return n.offsetParent !== null; });
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === $("panel"))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!$("panel").contains(document.activeElement)) { e.preventDefault(); first.focus(); }
});

// ---- one attempt, one plan call ----------------------------------------------------------------------------------------------

var DECISIONS = { accept: "kept", retry: "tried again", signature: "stopped: the same refusal came twice", ceiling: "stopped: the attempts ran out",
                  defect: "stopped: the unit could not be built", provider: "stopped: the model was unavailable" };

function attemptBlock(r, last, trailRow) {
  var ev = r.ev;
  var sec = el("section", "sec " + (typeof ev.outcome === "string" ? ev.outcome : ""));
  sec.id = "att-" + (isNum(ev.n) ? ev.n : r.i);
  sec.appendChild(el("h3", "", "Attempt #" + (isNum(ev.n) ? ev.n : "?") + (typeof ev.decision === "string" ? " → " + ev.decision : "")));
  if (typeof ev.decision === "string" && DECISIONS[ev.decision]) sec.appendChild(el("div", "note", "Decision: " + DECISIONS[ev.decision] + "."));
  if (ev.outcome === "human_patch") sec.appendChild(el("div", "note", "A person's own code, checked like a model's: no model was asked."));
  if (typeof ev.hint === "string" && ev.hint) sec.appendChild(el("div", "note", "The person's hint for this attempt: " + ev.hint));
  var st = callStats(ev, r.i);
  sec.appendChild(st.el);
  var sig = typeof ev.signature === "string" && ev.signature ? ev.signature : (trailRow && trailRow.sig ? trailRow.sig : null);
  if (sig) { var sg = el("div", "sig open", sig); sg.title = "The refusal signature the loop compared"; sec.appendChild(sg); }

  var miss = st.missing.slice();
  var refused = ev.outcome === "refused" || ev.outcome === "defect";
  var order = [["diff", true], ["feedback", true], ["checker", false], ["acceptance", true], ["stderr", false], ["code", last], ["reply", false], ["prompt", false]];
  order.forEach(function (o) {
    var lab = BLOBS.filter(function (b) { return b[0] === o[0]; })[0][1];
    var blk = blobBlock(lab, ev[o[0]], { open: o[1], diff: o[0] === "diff" });
    if (blk) {
      sec.appendChild(blk);
      if (o[0] === "prompt" && ev.primer === true) sec.appendChild(primerBlock());
    } else if (o[0] === "prompt" || o[0] === "reply" || o[0] === "code" || (o[0] === "feedback" && refused) || (o[0] === "diff" && isNum(ev.n) && ev.n > 0) || (o[0] === "acceptance" && !refused)) {
      miss.push(lab.toLowerCase().replace(" (full text)", ""));
    }
  });
  var mn = missingNote(miss);
  if (mn) sec.appendChild(mn);
  return sec;
}

function planCallBlock(r) {
  var ev = r.ev;
  var sec = el("section", "sec " + (typeof ev.outcome === "string" ? ev.outcome : ""));
  sec.appendChild(el("h3", "", "Planner round " + (isNum(ev.round) ? ev.round : "?") + (isNum(ev.sample) && ev.sample > 0 ? ", sample " + ev.sample : "")));
  var st = callStats(ev, r.i);
  sec.appendChild(st.el);
  var miss = st.missing.slice();
  var p = blobBlock("What was asked", ev.prompt, {});
  if (p) { sec.appendChild(p); if (ev.primer === true) sec.appendChild(primerBlock()); } else miss.push("what was asked");
  var a = blobBlock("What came back", ev.reply, {});
  if (a) sec.appendChild(a); else miss.push("what came back");
  if (Array.isArray(ev.errors)) {
    if (ev.errors.length) {
      sec.appendChild(el("div", "note", "Refusals fed back to the next round (" + ev.errors.length + "):"));
      var ul = el("ul", "errs");
      ev.errors.forEach(function (x) { ul.appendChild(el("li", "", String(x))); });
      sec.appendChild(ul);
    } else {
      sec.appendChild(el("div", "note", "No refusals: nothing was fed back."));
    }
  } else {
    miss.push("refusals fed back");
  }
  var mn = missingNote(miss);
  if (mn) sec.appendChild(mn);
  return sec;
}

function reviewBlock(r) {
  var ev = r.ev;
  var sec = el("section", "sec");
  sec.appendChild(el("h3", "", "Review of the cases"));
  var kv = el("div", "kv");
  if (isNum(ev.kept)) kv.appendChild(chip("kept", String(ev.kept))); 
  if (Array.isArray(ev.dropped)) kv.appendChild(chip("dropped", String(ev.dropped.length)));
  sec.appendChild(kv);
  var miss = [];
  if (!isNum(ev.kept)) miss.push("cases kept");
  if (Array.isArray(ev.dropped)) {
    if (ev.dropped.length) {
      var t = el("table", "dropped");
      var hr = el("tr");
      ["unit", "case", "why it was dropped"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
      t.appendChild(hr);
      ev.dropped.forEach(function (x) {
        var tr = el("tr");
        x = x && typeof x === "object" ? x : {};
        [x.unit, x.case, x.reason].forEach(function (v) { tr.appendChild(el("td", "", v === undefined || v === null ? "not recorded" : String(v))); });
        t.appendChild(tr);
      });
      sec.appendChild(t);
    } else {
      sec.appendChild(el("div", "note", "No case was dropped."));
    }
  } else {
    miss.push("dropped cases");
  }
  if (typeof ev.error === "string") sec.appendChild(el("div", "note warn", "The review failed: " + ev.error));
  var b = blobBlock("The review's own text", ev.blob, {});
  if (b) sec.appendChild(b);
  var mn = missingNote(miss);
  if (mn) sec.appendChild(mn);
  return sec;
}

function finalBlock(r) {
  var ev = r.ev;
  var sec = el("section", "sec " + (ev.valid === true ? "accepted" : ev.valid === false ? "refused" : ""));
  sec.appendChild(el("h3", "", "The plan that was used"));
  var kv = el("div", "kv");
  if (typeof ev.valid === "boolean") kv.appendChild(chip("valid", ev.valid ? "yes" : "no"));
  if (isNum(ev.units)) kv.appendChild(chip("units", String(ev.units)));
  sec.appendChild(kv);
  var b = blobBlock("The plan (json)", ev.plan, {});
  if (b) sec.appendChild(b);
  return sec;
}

/* retry-note:begin */
// The one place the page names a command: how a person continues a stuck unit (docs/build.md). The board runs nothing; this is text to copy. Built
// from board.json's run (brief, provider, model) where it knows them, with a placeholder for what it cannot know (the checker, the work directory, the agent).
function retryCommand(run, unit) {
  var plain = /^[A-Za-z0-9._\/+:=@%,-]+$/;
  function known(v, placeholder) { return typeof v === "string" && plain.test(v) ? v : placeholder; }
  var r = run || {};
  return "build <checker> " + known(r.brief, "<brief.txt>") + " <workdir> <agent-command> --provider " + known(r.provider, "<provider>") +
    " --model " + known(r.model, "<model>") + " --retry " + unit + ' --hint "<what you know about this unit>"';
}

function retryNote(run, unit) {
  var sec = el("section", "sec");
  sec.appendChild(el("h3", "", "Continue this unit"));
  sec.appendChild(el("div", "note", "This board only reads. To try the unit again with a hint of your own, run this in the folder of the run (the same checker, work directory and agent command as the run's; edit the hint). The units that need it are checked again after it. To give your own code instead: --patch " + unit + " <file>."));
  var cmd = retryCommand(run, unit);
  var pre = el("pre", "txt", cmd);
  pre.id = "retry-cmd";
  pre.tabIndex = 0;
  sec.appendChild(pre);
  var copy = el("button", "", "Copy command");
  copy.type = "button";
  copy.addEventListener("click", function () {
    var done = function () { copy.textContent = "Copied"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cmd).then(done, function () { selectText(pre); });
    else selectText(pre);
  });
  sec.appendChild(copy);
  return sec;
}

function selectText(node) {
  var range = document.createRange();
  range.selectNodeContents(node);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
/* retry-note:end */

// ---- the unit panel ------------------------------------------------------------------------------------------------------------

function openUnit(u, focusN, opener) {
  var id = u.id;
  openPanel("Unit " + id, u.function || "", function (body) {
    var states = stateOf(state.data);
    u = state.data.units.filter(function (x) { return x.id === id; })[0] || u;
    var top = el("section", "sec");

function fmtAt(ms) {

// ---- the graph ---------------------------------------------------------------------------------------------------------------

var SVGNS = (function () { var h = document.createElement("div"); h.innerHTML = "<svg></svg>"; return h.firstChild.namespaceURI; })();

  }

  var defs = sv("defs");

      (f.att === null ? "attempts not recorded" : plural(f.att, "attempt", "attempts")) + ", cost " + (f.cost || "not recorded") +
      (f.secs ? ", agent time " + f.secs : "") + needs + (onCrit[id] ? ", on the critical path" : "") + (rank[id] ? ", built number " + rank[id] : "") + ". Press Enter for details.");
    node.appendChild(sv("title", null, id + (u.function ? " (" + u.function + ")" : "") + (u.file ? " in " + u.file : "") + ": " + colName(u.column) + (onCrit[id] ? ", on the critical path" : "")));
    node.appendChild(sv("rect", { "class": "ring", x: -4, y: -4, width: g.nodeW + 8, height: g.nodeH + 8, rx: 12 }));
    node.appendChild(sv("rect", { "class": "box", width: g.nodeW, height: g.nodeH, rx: 8 }));

  if (focused) { var back = svg.querySelector('[data-unit="' + focused.replace(/["\\]/g, "") + '"]'); if (back) back.focus({ preventScroll: true }); }

    wrap.setAttribute("aria-label", "Timeline of the run; it scrolls inside this frame");
    var grid = el("div", "tgrid");
    grid.style.setProperty("--tw", tw + "px");
    var tickPct = (t.step / t.total * 100) + "% 100%";
    var ax = el("div", "trow taxis");
    ax.appendChild(el("div", "tlab", "time"));
    var at = el("div", "ttrack");
    t.ticks.forEach(function (x) { var s = el("span", "tick", fmtTick(x)); s.style.left = (x / t.total * 100) + "%"; at.appendChild(s); });
    t.breaks.forEach(function (b) {
      var s = el("span", "brk-l", "\u2026 " + fmtSecs(b.gap_ms / 1000) + " pause, not drawn");
      s.style.left = (b.x / t.total * 100) + "%"; at.appendChild(s);
    });
    ax.appendChild(at);
    grid.appendChild(ax);
    var byId = {};
    d.units.forEach(function (u) { if (!byId[u.id]) byId[u.id] = u; });
    var n = 0;
    t.rows.forEach(function (r) {
      var row = el("div", "trow");
      var lab;
      if (r.kind === "unit" && byId[r.key]) {
        lab = el("button", "tlab");
        lab.type = "button";
        n++;
        lab.appendChild(el("span", "muted", n + " "));
        lab.appendChild(document.createTextNode(r.label));
        lab.title = "Details of unit " + r.label;
        lab.setAttribute("aria-label", "Details of unit " + r.label);
        lab.addEventListener("click", function () { openUnit(byId[r.key], null, lab); });
      } else {
        lab = el("div", "tlab", r.kind === "unit" ? (n++, n + " " + r.label) : r.label);
      }
      row.appendChild(lab);
      var tr = el("div", "ttrack");
      tr.style.backgroundSize = tickPct;
      t.breaks.forEach(function (b) { var s = el("span", "brk"); s.style.left = (b.x / t.total * 100) + "%"; tr.appendChild(s); });
      if (r.missing) tr.appendChild(el("span", "tmiss", "Not recorded: the journal has no plan stage"));
      r.bars.forEach(function (b) {
        var left = (b.x0 / t.total * 100) + "%", width = Math.max(0, (b.x1 - b.x0) / t.total * 100) + "%";
        var e = evs[b.ev] || {}, node;
        if (b.kind === "span") {
          node = el("div", "tb span" + (b.open ? " open" : ""));
          node.title = r.label + (b.open ? ": started, no end recorded" : ": from its start to its end, " + fmtMs(b.x1 - b.x0));
        } else if (b.kind === "sweep") {
          node = el("div", "tb sweep");
          node.title = "Sweep after " + (b.unit || "the resume") + ": " + sweepText(e) + " " + fmtMs(b.x1 - b.x0);
        } else {
          node = el("button", "tb att " + (b.good === true ? "good" : b.good === false ? "bad" : "unk"));
          node.type = "button";
          var what = b.kind === "call" ? "Plan call" + (b.round !== null ? ", round " + b.round : "") : "Unit " + r.label + ", attempt " + (b.n === null ? "?" : b.n);
          var text = what + ": " + (b.outcome || "outcome not recorded") + ", " + (b.ms === null ? "time not recorded" : fmtMs(b.ms)) + ", at " + fmtMs(b.x1);
          node.title = text;
          node.setAttribute("aria-label", text + ". Press Enter for details.");
          node.addEventListener("click", function () { openEvent({ ev: evs[b.ev], i: b.ev }, node); });
        }
        node.style.left = left;
        node.style.width = width;
        tr.appendChild(node);
      });
      row.appendChild(tr);
      grid.appendChild(row);
    });
    wrap.appendChild(grid);
    box.appendChild(wrap);
    if (keep) { wrap.scrollLeft = keep[0]; wrap.scrollTop = keep[1]; }
  }
  var p = el("p", "est", est.text);
  p.setAttribute("role", "status");
  box.appendChild(p);
  box.appendChild(el("p", "note", "This is an estimate and an upper bound, not a promise: the agent's time per attempt from the journal, set against the plan's dependencies. Checks, sweeps and any waiting between units are not in it, and what parallel work would cost is not either. Units are built one at a time today."));
  if (est.agent_ms !== null && t.unitsWall !== null)
    box.appendChild(el("p", "note", "From the first unit start to the last unit end: " + fmtMs(t.unitsWall) + " of wall time, of which the agent's turns add up to " + fmtMs(est.agent_ms) + "."));
  if (t.notRun.length) box.appendChild(el("p", "note", "Not started in this run: " + (t.notRun.length > 20 ? t.notRun.slice(0, 20).join(", ") + " and " + (t.notRun.length - 20) + " more" : t.notRun.join(", ")) + "."));
}

// ---- tabs ----------------------------------------------------------------------------------------------------------------------

var VIEWS = ["board", "graph", "timeline", "story"];
function viewAvailable(v) { return v === "board" || v === "graph" || !!J; }
function showView(name) {
  if (VIEWS.indexOf(name) < 0 || !viewAvailable(name)) name = "board";
  VIEWS.forEach(function (v) {
    var on = v === name;
    $("view-" + v).hidden = !on;
    $("tab-" + v).setAttribute("aria-selected", on ? "true" : "false");
    $("tab-" + v).tabIndex = on ? 0 : -1;
  });
  state.view = name;
}
VIEWS.forEach(function (v) { $("tab-" + v).addEventListener("click", function () { showView(v); }); });
$("tabs").addEventListener("keydown", function (e) {
  var keys = { ArrowLeft: -1, ArrowRight: 1, Home: -100, End: 100 };
  if (!(e.key in keys)) return;
  var avail = VIEWS.filter(viewAvailable), at = avail.indexOf(state.view), k = keys[e.key], to;
  to = Math.abs(k) === 1 ? avail[(at + k + avail.length) % avail.length] : (k < 0 ? avail[0] : avail[avail.length - 1]);
  e.preventDefault();
  showView(to);
  $("tab-" + to).focus();
});

load();
</script>
