<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cancho-code board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5f6b7d; --line: #dde2ea; --soft: #eef1f5;
    --waiting: #7b8798; --building: #2f6fed; --verified: #17884f; --stuck: #c8372d; --regressed: #b46a00; --unknown: #8a6bb8;
    --ok: #17884f; --bad: #c8372d; --warn: #b46a00;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --panel: #1b212b; --ink: #e6eaf1; --muted: #98a3b5; --line: #2c3442; --soft: #232b37;
      --waiting: #8e9bb0; --building: #6a9cff; --verified: #4cc38a; --stuck: #ff7a70; --regressed: #f0b050; --unknown: #b79ae6;
      --ok: #4cc38a; --bad: #ff7a70; --warn: #f0b050;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 0.95rem; margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .title { min-width: 0; }
  .title p { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .filebtn {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; min-height: 36px;
  }
  button:hover, .filebtn:hover { border-color: var(--muted); }
  button:focus-visible, .filebtn:focus-within, .sig:focus-visible, summary:focus-visible, .dep:focus-visible { outline: 2px solid var(--building); outline-offset: 2px; }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  label.auto { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 0.9rem; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; border: 1px solid currentColor; }
  .pill.done { color: var(--ok); } .pill.stuck, .pill.gate_failed, .pill.provider_error, .pill.no_plan { color: var(--bad); }
  .pill.running, .pill.none { color: var(--muted); }

  #notice { margin: 0 0 12px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--panel); }
  #notice.error { border-color: var(--bad); }
  #notice[hidden] { display: none; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .metric .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .metric .v { font-size: 1.35rem; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .metric .s { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .metric.wide { grid-column: span 2; }
  .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; display: flex; margin-top: 6px; }
  .bar i { display: block; height: 100%; }
  .unknown-v { color: var(--muted); font-weight: 400; }

  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
  .col { background: var(--soft); border-radius: 12px; padding: 10px; min-width: 0; border-top: 3px solid var(--c); }
  .col h2 { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 8px; }
  .col h2 .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .col.waiting { --c: var(--waiting); } .col.building { --c: var(--building); } .col.verified { --c: var(--verified); }
  .col.stuck { --c: var(--stuck); } .col.regressed { --c: var(--regressed); } .col.unknown { --c: var(--unknown); }
  .col .empty { color: var(--muted); padding: 4px; font-size: 0.9rem; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; min-width: 0; }
  .card.flash, .sec.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--building); } to { box-shadow: 0 0 0 0 transparent; } }
  .card .head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .card .id { font-weight: 650; overflow-wrap: anywhere; }
  .card .fn { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 0.78rem; padding: 1px 8px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .dep { font: inherit; font-size: 0.78rem; padding: 1px 8px; min-height: 0; border-radius: 999px; display: inline-flex; gap: 5px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--waiting); display: inline-block; }
  .dot.waiting { background: var(--waiting); } .dot.building { background: var(--building); } .dot.verified { background: var(--verified); }
  .dot.stuck { background: var(--stuck); } .dot.regressed { background: var(--regressed); } .dot.unknown, .dot.missing { background: var(--unknown); }
  .nums { margin-top: 6px; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  details.trail { margin-top: 8px; }
  details.trail summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); }
  ol.attempts { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
  ol.attempts li { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; font-size: 0.82rem; min-width: 0; }
  ol.attempts li.verified { border-color: var(--verified); } ol.attempts li.refused, ol.attempts li.defect { border-color: var(--stuck); }
  ol.attempts li.outage { border-color: var(--regressed); }
  .a-line { display: flex; flex-wrap: wrap; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .a-out { font-weight: 600; }
  .sig { margin-top: 2px; font-family: var(--mono); font-size: 0.76rem; color: var(--muted); overflow-wrap: anywhere;
         display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .sig.open { display: block; }

  footer { margin-top: 18px; color: var(--muted); font-size: 0.85rem; }
  footer .files { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0; }
  footer .have::before { content: "\2713"; margin-right: 4px; color: var(--ok); }
  footer .lack::before { content: "\2014"; margin-right: 4px; color: var(--warn); }
  footer details { margin-top: 8px; }
  footer dt { font-weight: 600; margin-top: 6px; color: var(--ink); }
  footer dd { margin: 0; }

  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 85%, transparent);
          border: 3px dashed var(--building); font-size: 1.3rem; z-index: 10; pointer-events: none; }
  #drop.on { display: flex; }


  /* tabs, the detail panel and the story */
  .tabs { display: flex; gap: 6px; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  .tabs[hidden] { display: none; }
  .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; background: none; padding: 6px 14px; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--building); }
  .view[hidden] { display: none; }
  .card .open { margin-top: 8px; font-size: 0.82rem; padding: 3px 10px; min-height: 30px; }

  #shade { position: fixed; inset: 0; background: rgba(10, 14, 20, 0.5); z-index: 20; }
  #shade[hidden], #panel[hidden] { display: none; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column;
           border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(0, 0, 0, 0.25); }
  #panel:focus { outline: none; }
  .phead { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .phead h2 { font-size: 1.05rem; overflow-wrap: anywhere; }
  .phead p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
  #pbody { overflow: auto; padding: 12px 16px 28px; flex: 1; -webkit-overflow-scrolling: touch; }
  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; min-width: 0; }
  .sec > h3 { margin: 0 0 6px; font-size: 0.92rem; }
  .sec.refused, .sec.defect, .sec.truncated, .sec.failed { border-left: 4px solid var(--stuck); }
  .sec.accepted, .sec.verified, .sec.written { border-left: 4px solid var(--verified); }
  .kv { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 4px 0 8px; }
  .kv .chip b { font-weight: 600; }
  .note { color: var(--muted); font-size: 0.84rem; margin: 4px 0; }
  .note.warn { color: var(--warn); }
  details.blob { margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  details.blob > summary { cursor: pointer; padding: 5px 10px; font-size: 0.86rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  details.blob > summary .sz { color: var(--muted); font-size: 0.78rem; }
  details.blob > .in { padding: 0 10px 8px; }
  details.blob details.blob { background: var(--panel); }
  pre.txt { margin: 0; padding: 8px 10px; background: var(--soft); border-radius: 6px; font: 0.8rem/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
            max-height: 45vh; overflow: auto; }
  .diff { margin: 0; background: var(--soft); border-radius: 6px; font: 0.8rem/1.4 var(--mono); max-height: 45vh; overflow: auto; padding: 4px 0; }
  .diff .dl { display: block; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .add { background: color-mix(in srgb, var(--verified) 20%, transparent); }
  .diff .del { background: color-mix(in srgb, var(--stuck) 20%, transparent); }
  .diff .hunk { color: var(--building); }
  .diff .meta { color: var(--muted); font-weight: 600; }
  ul.errs { margin: 4px 0; padding-left: 20px; font-size: 0.86rem; overflow-wrap: anywhere; }
  table.dropped { border-collapse: collapse; width: 100%; font-size: 0.84rem; margin: 4px 0; }
  table.dropped th, table.dropped td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  ol.tl { list-style: none; margin: 0; padding: 0; }
  ol.tl li { margin: 0; }
  ol.tl button.row { width: 100%; text-align: left; display: grid; grid-template-columns: 5.5em 8.5em 1fr; gap: 8px; align-items: baseline; border: 0;
                     border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 6px 4px; min-height: 0; }
  ol.tl button.row:hover { background: var(--soft); }
  ol.tl .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  ol.tl .k { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
  ol.tl .s { overflow-wrap: anywhere; font-size: 0.86rem; }
  ol.tl li.bad .s { color: var(--bad); } ol.tl li.good .s { color: var(--ok); }
  .storyhead { margin-bottom: 12px; }
  .storyhead h2 { font-size: 1.05rem; margin-bottom: 4px; }

  @media (max-width: 640px) {
    .phead, #pbody { padding-left: 12px; padding-right: 12px; }
    ol.tl button.row { grid-template-columns: 4.5em 1fr; }
    ol.tl .k { display: none; }
  }

  @media (max-width: 640px) {
    main { padding: 12px; }
    .metric.wide { grid-column: span 1; }
    .metric .v { font-size: 1.15rem; }
    .board { grid-template-columns: 1fr; }
    /* on a phone the columns stack: what needs a look first, and the empty ones as a single line */
    .col.building { order: 1; } .col.stuck { order: 2; } .col.regressed { order: 3; } .col.unknown { order: 4; }
    .col.waiting { order: 5; } .col.verified { order: 6; }
    .col.none { padding-bottom: 2px; }
    .col.none h2 { padding-bottom: 4px; }
    .col.none .empty { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="title">
      <h1 id="title">cancho-code board</h1>
      <p id="subtitle" class="muted">read-only view of a run</p>
    </div>
    <div class="tools">
      <span id="verdict"></span>
      <label class="filebtn">Open board.json<input id="pick" type="file" accept=".json,application/json"></label>
      <button id="reload" type="button" title="Read board.json again">Reload</button>
      <label class="auto"><input id="auto" type="checkbox"> refresh every 5 s</label>
    </div>
  </header>

  <p id="notice" hidden></p>
  <div id="tabs" class="tabs" role="tablist" aria-label="Views" hidden>
    <button id="tab-board" type="button" role="tab" aria-selected="true" aria-controls="view-board">Board</button>
    <button id="tab-story" type="button" role="tab" aria-selected="false" aria-controls="view-story" tabindex="-1">Story</button>
  </div>
  <div id="view-board" class="view" role="tabpanel" aria-labelledby="tab-board">
    <section id="metrics" class="metrics" aria-label="Metrics"></section>
    <section id="board" class="board" aria-label="Units"></section>
  </div>
  <div id="view-story" class="view" role="tabpanel" aria-labelledby="tab-story" hidden></div>
  <footer id="foot"></footer>
</main>
<div id="shade" hidden></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" tabindex="-1" hidden>
  <div class="phead">
    <div><h2 id="ptitle"></h2><p id="psub"></p></div>
    <button id="pclose" type="button" aria-label="Close (Escape)">Close</button>
  </div>
  <div id="pbody"></div>
</aside>
<div id="drop">Drop board.json here</div>

<script>
"use strict";
var COLS = [
  ["waiting", "Waiting", "Dependencies not verified yet."],
  ["building", "Building", "The unit being built now."],
  ["verified", "Verified", "Its examples pass, and still did at the last sweep."],
  ["stuck", "Stuck", "Failed: the attempts ran out or the same refusal came twice."],
  ["regressed", "Regressed", "Verified once, broken by a later unit, back on the board."],
  ["unknown", "Unknown", "The files that would say are missing."]
];
var state = { data: null, from: "", timer: null, raw: null, view: "board" };

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function isNum(v) { return typeof v === "number" && isFinite(v); }

function fmtInt(v) { return isNum(v) ? Math.round(v).toLocaleString("en-US") : null; }
function fmtPct(v) { return isNum(v) ? (v * 100).toFixed(1) + "%" : null; }
function fmtUsd(v) {
  if (!isNum(v)) return null;
  if (v === 0) return "$0";
  return "$" + (v < 0.01 ? v.toFixed(6) : v.toFixed(4));
}
function fmtSecs(v) {
  if (!isNum(v)) return null;
  if (v < 90) return (Math.round(v * 10) / 10) + " s";
  var m = Math.floor(v / 60), s = Math.round(v - m * 60);
  return m + " min " + s + " s";
}
function fmtMs(v) { return isNum(v) ? (Math.round(v / 100) / 10) + " s" : null; }

// ---- loading -------------------------------------------------------------------------------------------------------------

function notice(text, isError) {
  var n = $("notice");
  if (!text) { n.hidden = true; return; }
  n.hidden = false;
  n.className = isError ? "error" : "";
  n.textContent = text;
}

function accept(text, from) {
  var d;
  try { d = JSON.parse(text); } catch (e) { notice("That file is not JSON: " + e.message, true); return; }
  if (!d || d.schema !== 1 || !Array.isArray(d.units) || !d.metrics) {
    notice("That is not a board.json made by the board tool (no schema 1, units and metrics).", true);
    return;
  }
  if (text === state.raw && from === state.from) { notice(""); return; }
  state.raw = text;
  state.data = d;
  state.from = from;
  notice("");
  render(d);
}

// The data file: board.json next to this page, or `?data=<a .json path next to it>` (a relative path of plain characters, never a URL).
var source = "board.json";
try {
  var asked = new URLSearchParams(location.search).get("data");
  if (asked && /^[A-Za-z0-9_\/.-]+\.json$/.test(asked) && asked.indexOf("..") < 0 && asked.charAt(0) !== "/") source = asked;
} catch (e) { /* keep the default */ }

function load() {
  fetch(source, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (t) { accept(t, source); })
    .catch(function () {
      if (!state.data) notice("No board.json next to this page could be read (opened from a file, or none there yet). Use “Open board.json” or drop the file on this page.", false);
      else notice("board.json could not be read again; showing what was loaded.", false);
    });
}

function readFile(f) {
  if (!f) return;
  f.text().then(function (t) { accept(t, f.name); });
}

$("pick").addEventListener("change", function (e) { readFile(e.target.files[0]); });
$("reload").addEventListener("click", load);
$("auto").addEventListener("change", function (e) {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (e.target.checked) state.timer = setInterval(load, 5000);
});
var depth = 0;
window.addEventListener("dragenter", function (e) { e.preventDefault(); depth++; $("drop").className = "on"; });
window.addEventListener("dragleave", function () { depth = Math.max(0, depth - 1); if (!depth) $("drop").className = ""; });
window.addEventListener("dragover", function (e) { e.preventDefault(); });
window.addEventListener("drop", function (e) {
  e.preventDefault(); depth = 0; $("drop").className = "";
  if (e.dataTransfer && e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
});

// ---- rendering -----------------------------------------------------------------------------------------------------------

function metric(parent, key, value, sub, tip, wide) {
  var m = el("div", "metric" + (wide ? " wide" : ""));
  if (tip) m.title = tip;
  m.appendChild(el("div", "k", key));
  var v = el("div", "v" + (value === null ? " unknown-v" : ""), value === null ? "unknown" : value);
  m.appendChild(v);
  if (sub) m.appendChild(el("div", "s", sub));
  parent.appendChild(m);
  return m;
}

function renderMetrics(d) {
  var box = $("metrics");
  box.textContent = "";
  var m = d.metrics, r = d.run || {};
  var total = isNum(m.units_total) ? m.units_total : 0;
  var ver = isNum(m.units_verified) ? m.units_verified : 0;
  var u = metric(box, "Units verified", ver + " / " + total, null, "Units in the Verified column over all units of the run.", true);
  var bar = el("div", "bar");
  COLS.forEach(function (c) {
    var n = m.columns ? m.columns[c[0]] : 0;
    if (n && total) {
      var seg = el("i");
      seg.style.width = (100 * n / total) + "%";
      seg.style.background = "var(--" + c[0] + ")";
      seg.title = c[1] + ": " + n;
      bar.appendChild(seg);
    }
  });
  u.appendChild(bar);

  metric(box, "Cost", fmtUsd(m.cost_usd),
    m.cost_per_verified_unit !== null && m.cost_per_verified_unit !== undefined ? fmtUsd(m.cost_per_verified_unit) + " per verified unit" : (d.files && d.files.usage && !d.files.prices ? "no price for this model" : null),
    "Sum over the calls of tokens times the price per million tokens (the prices file given to the tool).");
  var t = m.tokens;
  metric(box, "Tokens out", t ? fmtInt(t.out) : null,
    t ? "in " + fmtInt(t.in) + " · cache read " + fmtInt(t.cache_read) + " · cache write " + fmtInt(t.cache_write) : null,
    "Output tokens, as the API reported them (they include the thinking tokens).");
  metric(box, "Token efficiency", fmtPct(m.efficiency),
    m.efficiency_calls !== null && m.efficiency_calls !== undefined ? "kept calls " + fmtPct(m.efficiency_calls) : null,
    "Of all output tokens, the share that was kept (the last written reply of a verified unit) and new (not the file repeated). eval/metrics.py efficiency.");
  metric(box, "Thinking share", fmtPct(m.thinking_share),
    t && t.thinking !== null && t.thinking !== undefined ? fmtInt(t.thinking) + " thinking tokens" : "not recorded by this run",
    "Thinking tokens over output tokens.");
  metric(box, "Cache read share", fmtPct(m.cache_read_share), null,
    "Cache-read tokens over all input tokens (input + cache write + cache read).");
  metric(box, "Time", fmtSecs(r.seconds), m.calls !== null && m.calls !== undefined ? fmtInt(m.calls) + " model calls" : null, "Seconds of the whole run (run.json or build.json).");
  metric(box, "Audit", m.audit ? m.audit.passed + " / " + m.audit.of : null,
    m.audit && m.audit.of ? fmtPct(m.audit.passed / m.audit.of) : null, "The hidden audit's TOTAL, when audit.txt exists.");
}

function stateOf(d) {
  var by = {};
  d.units.forEach(function (u) { by[u.id] = u.column; });
  return by;
}

function trailItem(a) {
  var li = el("li", a.outcome || "");
  var line = el("div", "a-line");
  line.appendChild(el("span", "", "#" + (a.attempt === null || a.attempt === undefined ? "?" : a.attempt)));
  line.appendChild(el("span", "a-out", a.outcome || "?"));
  line.appendChild(el("span", "muted", a.decision ? "→ " + a.decision : ""));
  var t = fmtMs(a.agent_ms);
  if (t) line.appendChild(el("span", "muted", t));
  li.appendChild(line);
  if (a.sig) {
    var s = el("div", "sig", a.sig);
    s.tabIndex = 0;
    s.title = "Click to show all";
    s.addEventListener("click", function () { s.classList.toggle("open"); });
    li.appendChild(s);
  }
  return li;
}

function card(u, states, usageKnown) {
  var c = el("article", "card");
  c.id = "u-" + u.id;
  var head = el("div", "head");
  head.appendChild(el("span", "id", u.id));
  if (u.function) head.appendChild(el("span", "fn", u.function));
  c.appendChild(head);

  var chips = el("div", "chips");
  chips.appendChild(el("span", "chip", u.attempts === null ? "attempts: unknown" : u.attempts + (u.attempts === 1 ? " attempt" : " attempts")));
  if (u.regressions) chips.appendChild(el("span", "chip warn", "regressed " + u.regressions + "×"));
  c.appendChild(chips);

  if (Array.isArray(u.deps) && u.deps.length) {
    var deps = el("div", "chips");
    deps.appendChild(el("span", "muted", "needs"));
    u.deps.forEach(function (id) {
      var b = el("button", "dep");
      b.type = "button";
      var st = states[id] || "missing";
      b.appendChild(el("span", "dot " + st));
      b.appendChild(el("span", "", id));
      b.title = id + ": " + (states[id] || "not in this run");
      b.addEventListener("click", function () {
        var t = document.getElementById("u-" + id);
        if (!t) return;
        t.scrollIntoView({ block: "center", behavior: "smooth" });
        t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
      });
      deps.appendChild(b);
    });
    c.appendChild(deps);
  }

  var nums = [];
  if (u.calls === 0) {
    nums.push("no model calls yet");
  } else {
    if (u.tokens) {
      nums.push("out " + fmtInt(u.tokens.out) + (u.tokens.thinking !== null && u.tokens.thinking !== undefined ? " (" + fmtInt(u.tokens.thinking) + " thinking)" : ""));
      nums.push("in " + fmtInt(u.tokens.in));
      if (u.tokens.cache_read) nums.push("cache read " + fmtInt(u.tokens.cache_read));
    }
    var cost = fmtUsd(u.cost_usd);
    if (cost) nums.push(cost);
    if (u.calls !== null && u.calls !== undefined) nums.push(u.calls + (u.calls === 1 ? " call" : " calls"));
  }
  c.appendChild(el("div", "nums", nums.length ? nums.join(" · ") : (usageKnown ? "" : "tokens and cost: unknown")));
  var more = el("button", "open", "Details");
  more.type = "button";
  more.title = "The whole story of " + u.id;
  more.setAttribute("aria-label", "Details of unit " + u.id);
  more.addEventListener("click", function () { openUnit(u, null, more); });
  c.appendChild(more);

  if (Array.isArray(u.trail) && u.trail.length) {
    var d = el("details", "trail");
    d.open = u.column === "stuck" || u.column === "regressed" || u.column === "building" || u.trail.length > 1;
    d.appendChild(el("summary", "", "Attempts (" + u.trail.length + ")"));
    var ol = el("ol", "attempts");
    u.trail.forEach(function (a) { ol.appendChild(trailItem(a)); });
    d.appendChild(ol);
    c.appendChild(d);
  } else if (u.trail === null) {
    c.appendChild(el("div", "nums", "trail: unknown (no trail file)"));
  }
  return c;
}

function renderBoard(d) {
  var board = $("board");
  board.textContent = "";
  var states = stateOf(d);
  var usageKnown = !!(d.files && d.files.usage);
  COLS.forEach(function (cdef) {
    var units = d.units.filter(function (u) { return u.column === cdef[0]; });
    if (cdef[0] === "unknown" && !units.length) return;
    var col = el("section", "col " + cdef[0] + (units.length ? "" : " none"));
    var h = el("h2");
    h.title = cdef[2];
    h.appendChild(el("span", "", cdef[1]));
    h.appendChild(el("span", "n", String(units.length)));
    col.appendChild(h);
    if (!units.length) col.appendChild(el("div", "empty", "none"));
    units.forEach(function (u) { col.appendChild(card(u, states, usageKnown)); });
    board.appendChild(col);
  });
}

function renderHead(d) {
  var r = d.run || {};
  $("title").textContent = r.name ? "Run: " + r.name : "cancho-code run";
  var bits = [];
  if (r.brief) bits.push(r.brief);

  $("subtitle").textContent = bits.length ? bits.join(" · ") : "read-only view of a run";

function renderFoot(d) {
  var f = $("foot");
  f.textContent = "";
  var names = [["plan", "plan.json"], ["run_log", "run.log"], ["state", "state.txt"], ["usage", "usage.jsonl"],

  var files = el("div", "files");

  f.appendChild(files);

  [["Cost", "tokens times the price per million tokens, summed over every model call, retries included."],
   ["Token efficiency", "output tokens of the kept replies that were new work, over all output tokens (eval/metrics.py)."],
   ["Thinking share", "thinking tokens over output tokens; unknown for runs that did not record thinking."],

function render(d) {

// ---- the journal: the detail panel and the story ---------------------------------------------------------------------------
// board.json's `journal` (docs/dashboard.md): the events verbatim, in order, and the blobs they name as bounded excerpts. Anything
// missing is shown as "not recorded", never as empty or zero. Everything here is built with textContent, never markup.

var J = null;                 // the index of the journal of the board on show, or null
var panelState = { open: false, build: null, opener: null };
var BLOBS = [["prompt", "Prompt sent"], ["reply", "Model reply"], ["code", "Code"], ["feedback", "Compiler refusal (full text)"],
             ["checker", "Checker output"], ["acceptance", "Acceptance and test output"], ["diff", "Diff against the previous attempt"],
             ["stderr", "stderr"], ["blob", "Detail"], ["plan", "Plan"]];

function indexJournal(d) {
  var j = d && d.journal;
  if (!j || !Array.isArray(j.events)) return null;
  var ix = { j: j, units: {}, calls: [], review: null, final: null, start: null, end: null, any: false };
  function unit(id) {
    if (!ix.units[id]) ix.units[id] = { start: null, attempts: [], end: null, sweeps: [] };
    return ix.units[id];
  }
  j.events.forEach(function (ev, i) {
    if (!ev || typeof ev !== "object") return;
    var r = { ev: ev, i: i };
    switch (ev.kind) {
      case "run_start": if (!ix.start) ix.start = r; break;
      case "run_end": ix.end = r; break;
      case "plan_call": ix.calls.push(r); break;
      case "plan_review": ix.review = r; break;
      case "plan_final": ix.final = r; break;
      case "unit_start": if (typeof ev.unit === "string") unit(ev.unit).start = r; break;
      case "attempt": if (typeof ev.unit === "string") unit(ev.unit).attempts.push(r); break;
      case "unit_end": if (typeof ev.unit === "string") unit(ev.unit).end = r; break;
      case "sweep": if (typeof ev.after_unit === "string") unit(ev.after_unit).sweeps.push(r); break;
    }
  });
  return ix;
}

function costOf(i) {
  var c = J && J.j.costs ? J.j.costs[i] : null;
  return isNum(c) ? c : null;
}

function blobInfo(name) {
  if (typeof name !== "string") return { s: "absent" };
  var v = (J.j.blobs || {})[name];
  if (v === undefined) return { s: "unlisted" };
  if (v === null) return { s: "missing" };
  if (v.omitted) return { s: "omitted" };
  if (typeof v.text !== "string") return { s: "unlisted" };
  return { s: "ok", v: v };
}

function fmtBytes(n) { return isNum(n) ? (n >= 10240 ? Math.round(n / 1024) + " KiB" : n + " B") : "?"; }

// Unified diff text as coloured lines (the +/- stays in the text, so colour is not the only signal).
function diffView(text) {
  var box = el("div", "diff");
  box.tabIndex = 0;
  var lines = text.split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  lines.forEach(function (ln) {
    var cls = "dl";
    if (/^(\+\+\+|---) /.test(ln) || /^(diff |index )/.test(ln)) cls += " meta";
    else if (ln.charAt(0) === "+") cls += " add";
    else if (ln.charAt(0) === "-") cls += " del";
    else if (ln.slice(0, 2) === "@@") cls += " hunk";
    box.appendChild(el("span", cls, ln === "" ? " " : ln));
  });
  return box;
}

// A collapsible text: the blob `name`, or a note saying why there is none. `o.open`, `o.diff`. null when the event has no such field.
function blobBlock(label, name, o) {
  o = o || {};
  var info = blobInfo(name);
  if (info.s === "absent") return null;
  var det = el("details", "blob");
  det.open = !!o.open;
  var sum = el("summary");
  sum.appendChild(el("span", "", label));
  if (info.s === "ok") sum.appendChild(el("span", "sz", fmtBytes(info.v.bytes)));
  det.appendChild(sum);
  var inn = el("div", "in");
  if (info.s === "ok") {
    if (info.v.text === "") inn.appendChild(el("div", "note", "(empty)"));
    else if (o.diff) inn.appendChild(diffView(info.v.text));
    else { var pre = el("pre", "txt", info.v.text); pre.tabIndex = 0; inn.appendChild(pre); }
    if (info.v.truncated) inn.appendChild(el("div", "note warn", "Truncated: the first " + fmtBytes(J.j.limits && J.j.limits.blob_bytes) + " of " + fmtBytes(info.v.bytes) + ". Full text: journal/blobs/" + name + " in the run directory."));
  } else if (info.s === "missing") {
    inn.appendChild(el("div", "note warn", "Not recorded: the file journal/blobs/" + name + " is missing from the run directory."));
  } else if (info.s === "omitted") {
    inn.appendChild(el("div", "note warn", "Left out of board.json to keep it small. Full text: journal/blobs/" + name + " in the run directory."));
  } else {
    inn.appendChild(el("div", "note warn", "Not recorded: board.json has no text for " + name + "."));
  }
  det.appendChild(inn);
  return det;
}

function primerBlock() {
  var b = blobBlock("primer (same for every call)", "primer.txt", {});
  if (b) return b;
  return el("div", "note", "primer (same for every call): not recorded");
}

function chip(label, value) {
  var c = el("span", "chip");
  if (value === undefined) { c.textContent = label; return c; }
  c.appendChild(el("span", "muted", label + " "));
  c.appendChild(el("b", "", value));
  return c;
}

// tokens, time, stop reason and cost of one call
function callStats(ev, i) {
  var kv = el("div", "kv");
  var missing = [];
  if (typeof ev.outcome === "string") kv.appendChild(chip("outcome", ev.outcome)); else missing.push("outcome");
  if (typeof ev.decision === "string") kv.appendChild(chip("decision", ev.decision));
  if (isNum(ev.ms)) kv.appendChild(chip("time", fmtMs(ev.ms))); else missing.push("time");
  if (typeof ev.stop === "string") kv.appendChild(chip("stop", ev.stop)); else missing.push("stop reason");
  var t = ev.tokens;
  if (t && typeof t === "object") {
    var bits = ["in " + (fmtInt(t.in) || "?"), "out " + (fmtInt(t.out) || "?")];
    if (isNum(t.thinking)) bits.push("thinking " + fmtInt(t.thinking));
    if (isNum(t.cache_read)) bits.push("cache read " + fmtInt(t.cache_read));
    if (isNum(t.cache_write)) bits.push("cache write " + fmtInt(t.cache_write));
    kv.appendChild(chip("tokens", bits.join(" · ")));
    var c = costOf(i);
    if (c !== null) kv.appendChild(chip("cost", fmtUsd(c))); else missing.push("cost (no price for this model)");
  } else {
    missing.push("tokens", "cost");
  }
  if (isNum(ev.exit)) kv.appendChild(chip("exit", String(ev.exit)));
  return { el: kv, missing: missing };
}

function missingNote(list) {
  return list.length ? el("div", "note", "Not recorded: " + list.join(", ") + ".") : null;
}

// ---- the panel ---------------------------------------------------------------------------------------------------------------

function openPanel(title, sub, build, opener) {
  var p = $("panel"), body = $("pbody");
  var keep = panelState.open ? body.scrollTop : 0;
  $("ptitle").textContent = title;
  $("psub").textContent = sub || "";
  body.textContent = "";
  build(body);
  body.scrollTop = keep;
  panelState.build = function () { openPanel(title, sub, build); };
  if (!panelState.open) {
    panelState.open = true;
    panelState.opener = opener || document.activeElement;
    $("shade").hidden = false;
    p.hidden = false;
    document.querySelector("main").inert = true;
    $("pclose").focus();
  }
}

function closePanel() {
  if (!panelState.open) return;
  panelState.open = false;
  $("panel").hidden = true;
  $("shade").hidden = true;
  document.querySelector("main").inert = false;
  var o = panelState.opener;
  panelState.opener = null;
  panelState.build = null;
  if (o && o.focus && document.body.contains(o)) o.focus();
}

$("pclose").addEventListener("click", closePanel);
$("shade").addEventListener("click", closePanel);
document.addEventListener("keydown", function (e) {
  if (!panelState.open) return;
  if (e.key === "Escape") { e.preventDefault(); closePanel(); return; }
  if (e.key !== "Tab") return;
  var f = Array.prototype.filter.call($("panel").querySelectorAll("button, summary, [tabindex='0'], a[href]"), function (n) { return n.offsetParent !== null; });
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === $("panel"))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!$("panel").contains(document.activeElement)) { e.preventDefault(); first.focus(); }
});

// ---- one attempt, one plan call ----------------------------------------------------------------------------------------------

var DECISIONS = { accept: "kept", retry: "tried again", signature: "stopped: the same refusal came twice", ceiling: "stopped: the attempts ran out",
                  defect: "stopped: the unit could not be built", provider: "stopped: the model was unavailable" };

function attemptBlock(r, last, trailRow) {
  var ev = r.ev;
  var sec = el("section", "sec " + (typeof ev.outcome === "string" ? ev.outcome : ""));
  sec.id = "att-" + (isNum(ev.n) ? ev.n : r.i);
  sec.appendChild(el("h3", "", "Attempt #" + (isNum(ev.n) ? ev.n : "?") + (typeof ev.decision === "string" ? " → " + ev.decision : "")));
  if (typeof ev.decision === "string" && DECISIONS[ev.decision]) sec.appendChild(el("div", "note", "Decision: " + DECISIONS[ev.decision] + "."));
  var st = callStats(ev, r.i);
  sec.appendChild(st.el);
  var sig = typeof ev.signature === "string" && ev.signature ? ev.signature : (trailRow && trailRow.sig ? trailRow.sig : null);
  if (sig) { var sg = el("div", "sig open", sig); sg.title = "The refusal signature the loop compared"; sec.appendChild(sg); }

  var miss = st.missing.slice();
  var refused = ev.outcome === "refused" || ev.outcome === "defect";
  var order = [["diff", true], ["feedback", true], ["checker", false], ["acceptance", true], ["stderr", false], ["code", last], ["reply", false], ["prompt", false]];
  order.forEach(function (o) {
    var lab = BLOBS.filter(function (b) { return b[0] === o[0]; })[0][1];
    var blk = blobBlock(lab, ev[o[0]], { open: o[1], diff: o[0] === "diff" });
    if (blk) {
      sec.appendChild(blk);
      if (o[0] === "prompt" && ev.primer === true) sec.appendChild(primerBlock());
    } else if (o[0] === "prompt" || o[0] === "reply" || o[0] === "code" || (o[0] === "feedback" && refused) || (o[0] === "diff" && isNum(ev.n) && ev.n > 0) || (o[0] === "acceptance" && !refused)) {
      miss.push(lab.toLowerCase().replace(" (full text)", ""));
    }
  });
  var mn = missingNote(miss);
  if (mn) sec.appendChild(mn);
  return sec;
}

function planCallBlock(r) {
  var ev = r.ev;
  var sec = el("section", "sec " + (typeof ev.outcome === "string" ? ev.outcome : ""));
  sec.appendChild(el("h3", "", "Planner round " + (isNum(ev.round) ? ev.round : "?") + (isNum(ev.sample) && ev.sample > 0 ? ", sample " + ev.sample : "")));
  var st = callStats(ev, r.i);
  sec.appendChild(st.el);
  var miss = st.missing.slice();
  var p = blobBlock("What was asked", ev.prompt, {});
  if (p) { sec.appendChild(p); if (ev.primer === true) sec.appendChild(primerBlock()); } else miss.push("what was asked");
  var a = blobBlock("What came back", ev.reply, {});
  if (a) sec.appendChild(a); else miss.push("what came back");
  if (Array.isArray(ev.errors)) {
    if (ev.errors.length) {
      sec.appendChild(el("div", "note", "Refusals fed back to the next round (" + ev.errors.length + "):"));
      var ul = el("ul", "errs");
      ev.errors.forEach(function (x) { ul.appendChild(el("li", "", String(x))); });
      sec.appendChild(ul);
    } else {
      sec.appendChild(el("div", "note", "No refusals: nothing was fed back."));
    }
  } else {
    miss.push("refusals fed back");
  }
  var mn = missingNote(miss);
  if (mn) sec.appendChild(mn);
  return sec;
}

function reviewBlock(r) {
  var ev = r.ev;
  var sec = el("section", "sec");
  sec.appendChild(el("h3", "", "Review of the cases"));
  var kv = el("div", "kv");
  if (isNum(ev.kept)) kv.appendChild(chip("kept", String(ev.kept))); 
  if (Array.isArray(ev.dropped)) kv.appendChild(chip("dropped", String(ev.dropped.length)));
  sec.appendChild(kv);
  var miss = [];
  if (!isNum(ev.kept)) miss.push("cases kept");
  if (Array.isArray(ev.dropped)) {
    if (ev.dropped.length) {
      var t = el("table", "dropped");
      var hr = el("tr");
      ["unit", "case", "why it was dropped"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
      t.appendChild(hr);
      ev.dropped.forEach(function (x) {
        var tr = el("tr");
        x = x && typeof x === "object" ? x : {};
        [x.unit, x.case, x.reason].forEach(function (v) { tr.appendChild(el("td", "", v === undefined || v === null ? "not recorded" : String(v))); });
        t.appendChild(tr);
      });
      sec.appendChild(t);
    } else {
      sec.appendChild(el("div", "note", "No case was dropped."));
    }
  } else {
    miss.push("dropped cases");
  }
  if (typeof ev.error === "string") sec.appendChild(el("div", "note warn", "The review failed: " + ev.error));
  var b = blobBlock("The review's own text", ev.blob, {});
  if (b) sec.appendChild(b);
  var mn = missingNote(miss);
  if (mn) sec.appendChild(mn);
  return sec;
}

function finalBlock(r) {
  var ev = r.ev;
  var sec = el("section", "sec " + (ev.valid === true ? "accepted" : ev.valid === false ? "refused" : ""));
  sec.appendChild(el("h3", "", "The plan that was used"));
  var kv = el("div", "kv");
  if (typeof ev.valid === "boolean") kv.appendChild(chip("valid", ev.valid ? "yes" : "no"));
  if (isNum(ev.units)) kv.appendChild(chip("units", String(ev.units)));
  sec.appendChild(kv);
  var b = blobBlock("The plan (json)", ev.plan, {});
  if (b) sec.appendChild(b);
  return sec;
}

// ---- the unit panel ------------------------------------------------------------------------------------------------------------

function openUnit(u, focusN, opener) {
  var id = u.id;
  openPanel("Unit " + id, u.function || "", function (body) {
    var states = stateOf(state.data);
    u = state.data.units.filter(function (x) { return x.id === id; })[0] || u;
    var top = el("section", "sec");
    var kv = el("div", "kv");
    kv.appendChild(chip("state", u.column));
    kv.appendChild(chip("attempts", u.attempts === null ? "unknown" : String(u.attempts)));
    if (u.regressions) kv.appendChild(chip("regressed", u.regressions + "×"));
    var cost = fmtUsd(u.cost_usd);
    kv.appendChild(chip("total cost", cost || "not recorded"));
    if (u.tokens) kv.appendChild(chip("tokens", "in " + fmtInt(u.tokens.in) + " · out " + fmtInt(u.tokens.out)));
    if (isNum(u.calls)) kv.appendChild(chip("model calls", String(u.calls)));
    top.appendChild(kv);
    if (Array.isArray(u.deps) && u.deps.length) {
      var deps = el("div", "chips");
      deps.appendChild(el("span", "muted", "needs"));
      u.deps.forEach(function (id) {
        var b = el("button", "dep");
        b.type = "button";
        b.appendChild(el("span", "dot " + (states[id] || "missing")));
        b.appendChild(el("span", "", id));
        b.title = "Open " + id;
        var other = state.data.units.filter(function (x) { return x.id === id; })[0];
        if (other) b.addEventListener("click", function () { openUnit(other, null); });
        else b.disabled = true;
        deps.appendChild(b);
      });
      top.appendChild(deps);
    } else if (u.deps === null) {
      top.appendChild(el("div", "note", "Dependencies: not recorded (no plan.json)."));
    }
    body.appendChild(top);

    var jr = J && J.units[u.id];
    if (jr && jr.start && typeof jr.start.ev.function === "string" && !u.function) $("psub").textContent = jr.start.ev.function;
    if (jr && jr.attempts.length) {
      jr.attempts.forEach(function (r, k) {
        var tr = Array.isArray(u.trail) ? u.trail.filter(function (t) { return t.attempt === r.ev.n; })[0] : null;
        body.appendChild(attemptBlock(r, k === jr.attempts.length - 1, tr));
      });
      if (jr.end) {
        var e = jr.end.ev;
        body.appendChild(el("div", "note", "Ended: " + (typeof e.state === "string" ? e.state : "state not recorded") + (isNum(e.attempts) ? " after " + e.attempts + (e.attempts === 1 ? " attempt." : " attempts.") : ".")));
      } else {
        body.appendChild(el("div", "note", "No end of this unit in the journal: it was still being built, or the run stopped."));
      }
      jr.sweeps.forEach(function (r) { body.appendChild(el("div", "note", "Sweep after this unit: " + sweepText(r.ev))); });
    } else {
      var sec = el("section", "sec");
      sec.appendChild(el("h3", "", "Attempts"));
      if (Array.isArray(u.trail) && u.trail.length) {
        var ol = el("ol", "attempts");
        u.trail.forEach(function (a) { ol.appendChild(trailItem(a)); });
        sec.appendChild(ol);
      } else {
        sec.appendChild(el("div", "note", u.trail === null ? "Not recorded: this run has no trail file for the unit." : "No attempts yet."));
      }
      sec.appendChild(el("div", "note", J ? "Not recorded: the journal has no events for this unit, so no prompts, replies, code or diffs." : "Not recorded: this run has no journal, so no prompts, replies, code or diffs."));
      body.appendChild(sec);
    }
    if (focusN !== null && focusN !== undefined) {
      var t = document.getElementById("att-" + focusN);
      if (t) { t.scrollIntoView({ block: "start" }); t.classList.add("flash"); }
    }
  }, opener);
}

function sweepText(ev) {
  function part(v) { return Array.isArray(v) ? (v.length ? v.join(", ") : "none") : (isNum(v) ? String(v) : "not recorded"); }
  return "held " + part(ev.held) + "; regressed " + part(ev.regressed) + ".";
}

// ---- the story -----------------------------------------------------------------------------------------------------------------

function fmtAt(ms) {
  if (!isNum(ms)) return "?";
  return ms < 90000 ? "+" + (Math.round(ms / 100) / 10) + " s" : "+" + fmtSecs(ms / 1000);
}

function eventLine(r) {
  var e = r.ev, k = e.kind, cls = "";
  var s;
  function nz(v) { return v === undefined || v === null ? "?" : v; }
  if (k === "run_start") s = "The run started" + (e.provider || e.model ? " (" + [e.provider, e.model].filter(Boolean).join(" / ") + ")" : "");
  else if (k === "plan_call") { s = "Planner round " + nz(e.round) + ": " + (e.outcome || "outcome not recorded") + (Array.isArray(e.errors) && e.errors.length ? ", " + e.errors.length + " refusal(s) fed back" : ""); if (e.outcome === "refused") cls = "bad"; }
  else if (k === "plan_review") s = "Review: kept " + nz(e.kept) + ", dropped " + (Array.isArray(e.dropped) ? e.dropped.length : "?");
  else if (k === "plan_final") { s = "Plan " + (e.valid === true ? "valid" : e.valid === false ? "not valid" : "validity not recorded") + (isNum(e.units) ? ", " + e.units + " units" : ""); cls = e.valid === false ? "bad" : ""; }
  else if (k === "unit_start") s = "Unit " + nz(e.unit) + " started" + (e.function ? " (" + e.function + ")" : "");
  else if (k === "attempt") { s = "Unit " + nz(e.unit) + ", attempt #" + nz(e.n) + ": " + (e.outcome || "outcome not recorded") + (e.decision ? " → " + e.decision : "") + (isNum(e.ms) ? " · " + fmtMs(e.ms) : ""); cls = e.outcome === "refused" || e.outcome === "defect" ? "bad" : (e.outcome === "accepted" || e.outcome === "verified" ? "good" : ""); }
  else if (k === "sweep") s = "Sweep after " + nz(e.after_unit) + ": " + sweepText(e);
  else if (k === "unit_end") { s = "Unit " + nz(e.unit) + " ended: " + (e.state || "state not recorded"); cls = e.state === "failed" ? "bad" : (e.state === "verified" ? "good" : ""); }
  else if (k === "run_end") { s = "The run ended: " + (e.verdict || "verdict not recorded") + (isNum(e.exit) ? " (exit " + e.exit + ")" : "") + (isNum(e.seconds) ? " after " + fmtSecs(e.seconds) : ""); cls = e.verdict === "done" ? "good" : (e.verdict ? "bad" : ""); }
  else s = typeof k === "string" ? "Event " + k : "An event without a kind";
  return { text: s, cls: cls };
}

function openEvent(r, opener) {
  var e = r.ev;
  if ((e.kind === "attempt" || e.kind === "unit_start" || e.kind === "unit_end" || e.kind === "sweep") && state.data) {
    var id = e.kind === "sweep" ? e.after_unit : e.unit;
    var u = state.data.units.filter(function (x) { return x.id === id; })[0];
    if (u) { openUnit(u, e.kind === "attempt" ? e.n : null, opener); return; }
  }
  openPanel(eventLine(r).text, fmtAt(e.t_ms) + " · " + (e.kind || "?"), function (body) {
    if (e.kind === "plan_call") body.appendChild(planCallBlock(r));
    else if (e.kind === "plan_review") body.appendChild(reviewBlock(r));
    else if (e.kind === "plan_final") body.appendChild(finalBlock(r));
    var sec = el("section", "sec");
    sec.appendChild(el("h3", "", "The event as recorded"));
    var pre = el("pre", "txt", JSON.stringify(e, null, 1));
    pre.tabIndex = 0;
    sec.appendChild(pre);
    body.appendChild(sec);
  }, opener);
}

function renderStory(d) {
  var box = $("view-story");
  box.textContent = "";
  if (!J) { box.appendChild(el("p", "note", "Not recorded: this run has no journal.")); return; }
  var jj = J.j, r = d.run || {};
  var head = el("section", "sec storyhead");
  head.appendChild(el("h2", "", "The run"));
  var s = J.start ? J.start.ev : {};
  var brief = typeof s.brief === "string" ? s.brief : r.brief;
  head.appendChild(el("p", "", brief ? brief : "Brief: not recorded."));
  var kv = el("div", "kv");
  var prov = [s.provider || r.provider, s.model || r.model].filter(Boolean).join(" / ");
  kv.appendChild(chip("model", prov || "not recorded"));
  var en = J.end ? J.end.ev : null;
  kv.appendChild(chip("verdict", en && en.verdict ? en.verdict : (r.verdict || "not recorded")));
  if (en && isNum(en.seconds)) kv.appendChild(chip("time", fmtSecs(en.seconds)));
  if (en && isNum(en.exit)) kv.appendChild(chip("exit", String(en.exit)));
  kv.appendChild(chip("events", String(jj.events.length)));
  head.appendChild(kv);
  if (!J.start) head.appendChild(el("div", "note", "Not recorded: the start of the run."));
  if (s.options && typeof s.options === "object") {
    var o = el("details", "blob");
    o.appendChild(el("summary", "", "Options of the run"));
    var inn = el("div", "in"), pre = el("pre", "txt", JSON.stringify(s.options, null, 1));
    inn.appendChild(pre); o.appendChild(inn); head.appendChild(o);
  }
  if (!en) head.appendChild(el("div", "note warn", "The journal has no end of the run: it is still going, or it was stopped."));
  if (jj.partial_tail) head.appendChild(el("div", "note warn", "The last line of the journal is half written (the run was stopped while writing it); it is left out."));
  if (isNum(jj.skipped_lines) && jj.skipped_lines > 0) head.appendChild(el("div", "note warn", jj.skipped_lines + " line(s) of the journal could not be read and are left out."));
  if (isNum(jj.events_dropped) && jj.events_dropped > 0) head.appendChild(el("div", "note warn", jj.events_dropped + " later event(s) are not in board.json (limit of 20,000)."));
  if (isNum(jj.blobs_omitted) && jj.blobs_omitted > 0) head.appendChild(el("div", "note warn", jj.blobs_omitted + " text(s) were left out of board.json to keep it small; they are in journal/blobs/."));
  head.appendChild(el("div", "note", "Texts are excerpts of up to " + fmtBytes(jj.limits && jj.limits.blob_bytes) + " each; the full files are in journal/blobs/ of the run directory."));
  box.appendChild(head);

  var plan = el("section", "storyplan");
  plan.appendChild(el("h2", "", "The plan"));
  if (!J.calls.length && !J.review && !J.final) plan.appendChild(el("p", "note", "Not recorded: the journal has no plan stage (a plan given by hand, or a run before the planner was recorded)."));
  J.calls.forEach(function (c) { plan.appendChild(planCallBlock(c)); });
  if (J.review) plan.appendChild(reviewBlock(J.review));
  if (J.final) plan.appendChild(finalBlock(J.final));
  box.appendChild(plan);

  var tl = el("section", "timeline");
  tl.appendChild(el("h2", "", "Timeline"));
  tl.appendChild(el("p", "note", "Everything that happened, in order. Click a line for its detail."));
  var ol = el("ol", "tl");
  var shown = 0, LIMIT = 400;
  function more() {
    var upto = Math.min(jj.events.length, shown + LIMIT);
    for (; shown < upto; shown++) {
      var ev = jj.events[shown];
      if (!ev || typeof ev !== "object") continue;
      var rec = { ev: ev, i: shown }, line = eventLine(rec);
      var li = el("li", line.cls);
      var b = el("button", "row");
      b.type = "button";
      b.appendChild(el("span", "t", fmtAt(ev.t_ms)));
      b.appendChild(el("span", "k", typeof ev.kind === "string" ? ev.kind : "?"));
      b.appendChild(el("span", "s", line.text));
      b.addEventListener("click", (function (rr, bb) { return function () { openEvent(rr, bb); }; })(rec, b));
      li.appendChild(b);
      ol.appendChild(li);
    }
    if (btn) btn.hidden = shown >= jj.events.length;
  }
  var btn = null;
  if (jj.events.length > LIMIT) {
    btn = el("button", "", "Show more events");
    btn.type = "button";
    btn.addEventListener("click", more);
  }
  more();
  tl.appendChild(ol);
  if (btn) tl.appendChild(btn);
  box.appendChild(tl);
}

// ---- tabs ----------------------------------------------------------------------------------------------------------------------

function showView(name) {
  var story = name === "story" && !!J;
  $("view-board").hidden = story;
  $("view-story").hidden = !story;
  $("tab-board").setAttribute("aria-selected", story ? "false" : "true");
  $("tab-story").setAttribute("aria-selected", story ? "true" : "false");
  $("tab-board").tabIndex = story ? -1 : 0;
  $("tab-story").tabIndex = story ? 0 : -1;
  state.view = story ? "story" : "board";
}
$("tab-board").addEventListener("click", function () { showView("board"); });
$("tab-story").addEventListener("click", function () { showView("story"); });
$("tabs").addEventListener("keydown", function (e) {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  var to = e.key === "ArrowRight" ? "story" : "board";
  showView(to);
  $("tab-" + to).focus();
});

load();
</script>
</body>
</html>
